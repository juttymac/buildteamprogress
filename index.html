<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pathway Build Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FBFAF4;
    --paper-raised: #FFFFFF;
    --ink: #221F17;
    --ink-soft: #6B6555;
    --ink-faint: #98917C;
    --line: #E7E1CD;
    --line-soft: #F1ECDC;
    --gold: #8C7530;
    --gold-deep: #6A5A24;
    --gold-tint: #F3ECD5;
    --success: #3E7A50;
    --success-tint: #E5EFE4;
    --info: #3B6EA0;
    --info-tint: #E4ECF3;
    --danger: #B3402F;
    --danger-tint: #F7E5E0;
    --neutral: #8B8570;
    --neutral-tint: #EFEBDC;
    --shadow-sm: 0 1px 2px rgba(34,31,23,.05);
    --shadow: 0 1px 2px rgba(34,31,23,.06), 0 10px 28px -16px rgba(34,31,23,.18);
    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 22px;
    --font-display: "Archivo Black", Arial Black, sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17150F; --paper-raised: #1F1C14; --ink: #F3EFE1; --ink-soft: #B8B097;
      --ink-faint: #837C68; --line: #35301F; --line-soft: #2A2618; --gold: #D6B968;
      --gold-deep: #E9D28D; --gold-tint: #2C2716; --success: #7BC08C; --success-tint: #1D2B1F;
      --info: #86B0DE; --info-tint: #1C2733; --danger: #E29486; --danger-tint: #33211B;
      --neutral: #A69F86; --neutral-tint: #26221A;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --paper: #17150F; --paper-raised: #1F1C14; --ink: #F3EFE1; --ink-soft: #B8B097;
    --ink-faint: #837C68; --line: #35301F; --line-soft: #2A2618; --gold: #D6B968;
    --gold-deep: #E9D28D; --gold-tint: #2C2716; --success: #7BC08C; --success-tint: #1D2B1F;
    --info: #86B0DE; --info-tint: #1C2733; --danger: #E29486; --danger-tint: #33211B;
    --neutral: #A69F86; --neutral-tint: #26221A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }
  a { color: var(--gold-deep); }

  .site-header { padding-bottom: 22px; margin-bottom: 28px; border-bottom: 2px dashed var(--line); }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
  .brand strong { color: var(--ink-soft); font-weight: 600; }
  .nav-link { font-family: var(--font-body); font-weight: 600; font-size: 13px; text-decoration: none; color: var(--ink-soft); border: 1px solid var(--line); background: var(--paper-raised); padding: 7px 14px; border-radius: 999px; transition: border-color .15s ease, color .15s ease; cursor: pointer; }
  .nav-link:hover { border-color: var(--gold); color: var(--gold-deep); }
  .eyebrow { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-deep); background: var(--gold-tint); padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
  h1.title { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1.06; letter-spacing: -.01em; margin: 0 0 8px; text-wrap: balance; }
  .subtitle { font-size: 15.5px; color: var(--ink-soft); max-width: 60ch; line-height: 1.5; margin: 0; }

  .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px; }
  .card + .card { margin-top: 18px; }
  .section-title { font-family: var(--font-body); font-weight: 700; font-size: 17px; margin: 0 0 4px; letter-spacing: -.01em; }
  .section-hint { font-size: 13.5px; color: var(--ink-faint); margin: 0 0 16px; }
  .rule-dashed { border: none; border-top: 2px dashed var(--line); margin: 30px 0; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field label { font-size: 12.5px; font-weight: 700; letter-spacing: .02em; color: var(--ink-soft); }
  input[type=text], input[type=date], input[type=file], select, textarea {
    font-family: var(--font-body); font-size: 14.5px; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%;
  }
  select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%); background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus, button:focus-visible, .nav-link:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  input[type=date] { font-family: var(--font-mono); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold-deep); }
  .checkline { display: flex; flex-direction: row; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-soft); }
  .checkline label { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); }

  .btn { font-family: var(--font-body); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 11px 22px; border: 1px solid transparent; cursor: pointer; transition: transform .08s ease, background .15s ease, border-color .15s ease; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--gold-deep); }
  .btn-primary:disabled { background: var(--neutral); cursor: not-allowed; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold-deep); }
  .btn-small { padding: 6px 14px; font-size: 12.5px; }

  .msg { font-size: 13.5px; font-weight: 600; margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); display: none; }
  .msg.show { display: block; }
  .msg.error { background: var(--danger-tint); color: var(--danger); }
  .msg.success { background: var(--success-tint); color: var(--success); }
  .msg.info { background: var(--info-tint); color: var(--info); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .01em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill-neutral { background: var(--neutral-tint); color: var(--ink-faint); }
  .pill-info { background: var(--info-tint); color: var(--info); }
  .pill-success { background: var(--success-tint); color: var(--success); }
  .pill-danger { background: var(--danger-tint); color: var(--danger); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--neutral-tint); }
  .bar-seg { height: 100%; }
  .bar-seg.done { background: var(--success); }
  .bar-seg.doing { background: var(--info); }
  .bar-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 9px; font-size: 12px; color: var(--ink-soft); }
  .bar-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .bar-legend .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .sw.done { background: var(--success); }
  .sw.doing { background: var(--info); }
  .sw.todo { background: var(--neutral-tint); border: 1px solid var(--line); }

  details.checklist { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  details.checklist summary { list-style: none; cursor: pointer; padding: 13px 16px; font-weight: 700; font-size: 14px; background: var(--line-soft); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  details.checklist summary::-webkit-details-marker { display: none; }
  details.checklist summary .car { transition: transform .15s ease; color: var(--ink-faint); font-size: 12px; }
  details.checklist[open] summary .car { transform: rotate(90deg); }
  .checklist-body { padding: 6px 16px 14px; }
  .stage-group { padding-top: 14px; }
  .stage-group:first-child { padding-top: 12px; }
  .stage-title { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 8px; }
  .step-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-soft); }
  .stage-group:first-child .step-row:first-child { border-top: none; }
  .step-label { font-size: 13.5px; color: var(--ink); }
  .step-row select { width: auto; min-width: 132px; padding: 6px 30px 6px 10px; font-size: 13px; }
  .step-help-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

  .step-view-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-soft); }
  .stage-group:first-child .step-view-row:first-child { border-top: none; }
  .step-view-label { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
  .step-view-badges { display: flex; gap: 6px; flex-shrink: 0; }

  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-chip { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .stat-chip .num { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; }
  .stat-chip .lbl { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
  .stat-chip.warn .num { color: var(--danger); }
  .stat-chip.info .num { color: var(--info); }

  .team-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 20px 22px; }
  .team-card + .team-card { margin-top: 14px; }
  .team-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .team-card-head h3 { font-size: 16.5px; margin: 0 0 4px; font-weight: 700; }
  .team-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .flag-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .flag-help { background: var(--danger-tint); color: var(--danger); }
  .flag-stalled { background: var(--gold-tint); color: var(--gold-deep); }
  .flag-ontrack { background: var(--success-tint); color: var(--success); }

  .mini-list { margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
  .mini-list-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin-bottom: 8px; }
  .mini-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 13.5px; }
  .mini-item + .mini-item { border-top: 1px dashed var(--line); }
  .mini-item .who { color: var(--ink-soft); }

  .roster-cadence { font-size: 13.5px; margin-bottom: 8px; }
  .roster-cadence .lbl { font-weight: 700; color: var(--ink-soft); }
  .roster-list { margin: 0 0 12px; padding-left: 18px; font-size: 13.5px; color: var(--ink-soft); }
  .roster-list li { padding: 2px 0; }
  details.roster-edit { margin-top: 4px; }
  details.roster-edit summary { display: inline-flex; align-items: center; gap: 4px; list-style: none; cursor: pointer; width: fit-content; font-size: 12.5px; font-weight: 600; color: var(--ink-faint); padding: 4px 10px; border-radius: 999px; background: var(--line-soft); }
  details.roster-edit summary::-webkit-details-marker { display: none; }
  details.roster-edit summary::before { content: "+"; font-weight: 700; }
  details.roster-edit[open] summary::before { content: "\2212"; }
  details.roster-edit summary:hover { color: var(--gold-deep); }
  .roster-edit-body { padding: 12px 2px 0; }

  .log-item-actions { margin-top: 10px; display: flex; justify-content: flex-end; }
  .btn-danger-ghost { color: var(--danger); border-color: var(--danger-tint); }
  .btn-danger-ghost:hover { background: var(--danger-tint); border-color: var(--danger); }
  .btn-danger-confirm { background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; }

  .log-list { margin-top: 6px; display: flex; flex-direction: column; gap: 12px; }
  .log-item { padding: 12px 14px; background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); }
  .log-item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .log-item-who { font-weight: 700; font-size: 13.5px; }
  .log-item-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }
  .log-item-summary { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.5; }
  .log-item-changes { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .log-item-file { margin-top: 8px; font-size: 12.5px; }

  .pin-wrap { max-width: 380px; margin: 60px auto; text-align: center; }
  .pin-wrap input { text-align: center; font-family: var(--font-mono); font-size: 22px; letter-spacing: .3em; padding: 12px; }

  .empty-note { font-size: 13.5px; color: var(--ink-faint); padding: 10px 0; }
  .loading-note { font-size: 13.5px; color: var(--ink-faint); padding: 40px 0; text-align: center; }
  footer.foot { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-faint); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  @media (max-width: 620px) {
    .field-row { grid-template-columns: 1fr; }
    .step-row { grid-template-columns: 1fr; }
    .step-row select { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="loading-note">Loading the board…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var CFG = window.PATHWAY_CONFIG || {};
  var STALE_DAYS = 14;
  var ADMIN_UNLOCK_KEY = "buildTeamAdminUnlocked_v1";
  var STATUS_LABEL = { not_started: "Not started", in_progress: "In progress", completed: "Completed" };
  var STATUS_PILL_CLASS = { not_started: "pill-neutral", in_progress: "pill-info", completed: "pill-success" };

  var META = {
    org: "Summit Church",
    tag: "Disciple-Making Pathway",
    eyebrow: "Build Team",
    title: "Pathway Build Board",
    subtitle: "Progress from each Category Team, tracked meeting by meeting."
  };

  // Milestone definitions -- structural, so they live in code rather than the database.
  var TEAM_DEFS = {
    "assimilation-membership": {
      name: "Assimilation and Membership",
      note: "Placeholder milestones -- swap in the real process once it is mapped out.",
      milestones: [
        { id: "am-1", stage: "Pathway", label: "Current Process Audit" },
        { id: "am-2", stage: "Pathway", label: "Pathway Steps Drafted" },
        { id: "am-3", stage: "Pathway", label: "Content & Resources Built" },
        { id: "am-4", stage: "Pathway", label: "Team Review Passed" },
        { id: "am-5", stage: "Pathway", label: "Pilot Run" },
        { id: "am-6", stage: "Pathway", label: "Finalized & Submitted" }
      ]
    }
  };
  ["gospel-story:gs:Gospel Story", "knowing-god:kg:Knowing God", "communing-with-god:cg:Communing with God",
   "life-in-community:lc:Life in Community", "life-on-mission:lm:Life on Mission"].forEach(function (spec) {
    var parts = spec.split(":"); var id = parts[0], p = parts[1], name = parts[2];
    var stages = ["New Disciple", "Growing Disciple", "Maturing Disciple", "Multiplying Disciple"];
    var perStage = ["Outcome Coverage Worksheet", "Build Sheet & Content Drafted", "Team Review Passed"];
    var milestones = []; var n = 1;
    stages.forEach(function (stage) {
      perStage.forEach(function (label) { milestones.push({ id: p + "-" + n, stage: stage, label: label }); n++; });
    });
    ["Category at a Glance", "Principle Check", "Packet Finalized & Submitted"].forEach(function (label) {
      milestones.push({ id: p + "-" + n, stage: "Wrap-Up", label: label }); n++;
    });
    TEAM_DEFS[id] = { name: name, milestones: milestones };
  });
  var TEAM_ORDER = ["assimilation-membership", "gospel-story", "knowing-god", "communing-with-god", "life-in-community", "life-on-mission"];

  var sb = null;
  var startupError = null;
  try {
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      startupError = "Couldn't load the Supabase client library (the script from the CDN didn't load). Check your internet connection, disable any ad blocker for this site, and reload. If it keeps happening, open the browser console (F12) for the exact error.";
    } else if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && CFG.SUPABASE_URL.indexOf("PASTE_") === -1) {
      sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    }
  } catch (e) {
    startupError = "Couldn't set up the connection to Supabase: " + (e && e.message ? e.message : e);
  }

  var app = document.getElementById("app");
  var state = { teams: [], submissions: [] };
  var ui = {
    view: locationView(),
    selectedTeamId: "",
    pinError: "",
    adminUnlocked: false,
    ready: false
  };

  try { ui.adminUnlocked = sessionStorage.getItem(ADMIN_UNLOCK_KEY) === "1"; } catch (e) {}

  // ---------- utilities ----------

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      var map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return map[c];
    });
  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
  function formatDatePretty(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  function formatDateTimePretty(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var h = d.getHours(); var h12 = h % 12 === 0 ? 12 : h % 12; var ampm = h >= 12 ? "PM" : "AM";
    return m[d.getMonth()] + " " + d.getDate() + ", " + pad2(h12) + ":" + pad2(d.getMinutes()) + " " + ampm;
  }
  function slugify(str) { return String(str).toLowerCase().replace(/[^a-z0-9.]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60); }
  function locationView() { return (location.hash || "").replace("#", "") === "admin" ? "admin" : "entry"; }

  async function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  // ---------- data ----------

  function teamById(id) { for (var i = 0; i < state.teams.length; i++) if (state.teams[i].id === id) return state.teams[i]; return null; }
  function submissionsForTeam(teamId) { return state.submissions.filter(function (s) { return s.teamId === teamId; }); }

  function defaultSteps(team) { var s = {}; team.milestones.forEach(function (m) { s[m.id] = { status: "not_started", help: false }; }); return s; }

  function currentSteps(team, subs) {
    if (!subs.length) return defaultSteps(team);
    var last = subs[subs.length - 1];
    var base = defaultSteps(team);
    Object.keys(last.steps || {}).forEach(function (k) { if (base[k]) base[k] = { status: last.steps[k].status || "not_started", help: !!last.steps[k].help }; });
    return base;
  }

  function countSteps(team, steps) {
    var done = 0, doing = 0, todo = 0, help = 0;
    team.milestones.forEach(function (m) {
      var s = steps[m.id] || { status: "not_started", help: false };
      if (s.status === "completed") done++; else if (s.status === "in_progress") doing++; else todo++;
      if (s.help && s.status !== "completed") help++;
    });
    return { done: done, doing: doing, todo: todo, help: help, total: team.milestones.length };
  }

  function diffSteps(prev, next, milestones) {
    var changes = [];
    milestones.forEach(function (m) {
      var b = prev[m.id] || { status: "not_started", help: false };
      var a = next[m.id] || { status: "not_started", help: false };
      if (b.status !== a.status || !!b.help !== !!a.help) changes.push({ label: m.label, from: b.status, to: a.status, help: !!a.help });
    });
    return changes;
  }

  function teamStats(team) {
    var subs = submissionsForTeam(team.id).slice().sort(function (a, b) { return a.submittedAt.localeCompare(b.submittedAt); });
    var steps = currentSteps(team, subs);
    var counts = countSteps(team, steps);
    var meetingDates = subs.map(function (s) { return s.meetingDate; }).filter(Boolean).sort();
    var count = subs.length;
    var lastMeetingDate = meetingDates.length ? meetingDates[meetingDates.length - 1] : null;
    var daysSinceLast = lastMeetingDate ? daysBetween(lastMeetingDate, todayISO()) : null;
    var avgGap = null;
    if (meetingDates.length >= 2) {
      var gaps = []; for (var i = 1; i < meetingDates.length; i++) gaps.push(daysBetween(meetingDates[i - 1], meetingDates[i]));
      var sum = 0; for (var j = 0; j < gaps.length; j++) sum += gaps[j];
      avgGap = Math.round((sum / gaps.length) * 10) / 10;
    }
    var awaitingReview = subs.filter(function (s) { return s.reviewRequested && !s.reviewed; });
    var flag = "ontrack";
    if (counts.help > 0) flag = "help"; else if (count === 0 || (daysSinceLast !== null && daysSinceLast > STALE_DAYS)) flag = "stalled";
    return { subs: subs, steps: steps, counts: counts, count: count, lastMeetingDate: lastMeetingDate, daysSinceLast: daysSinceLast, avgGap: avgGap, awaitingReview: awaitingReview, flag: flag };
  }

  function stagesOf(team) { var seen = [], out = []; team.milestones.forEach(function (m) { if (seen.indexOf(m.stage) === -1) { seen.push(m.stage); out.push(m.stage); } }); return out; }

  // ---------- load from Supabase ----------

  async function loadState() {
    if (!sb) {
      ui.ready = "unconfigured";
      render();
      return;
    }
    try {
      var teamsRes = await sb.from("teams").select("*");
      var subsRes = await sb.from("submissions").select("*").order("submitted_at", { ascending: true });
      if (teamsRes.error) throw teamsRes.error;
      if (subsRes.error) throw subsRes.error;

      state.teams = TEAM_ORDER.map(function (id) {
        var def = TEAM_DEFS[id];
        var row = (teamsRes.data || []).find(function (t) { return t.id === id; }) || {};
        return {
          id: id, name: def.name, note: def.note, milestones: def.milestones,
          roster: { members: row.roster_members || [], cadence: row.roster_cadence || "" }
        };
      });

      state.submissions = (subsRes.data || []).map(function (row) {
        return {
          id: row.id, teamId: row.team_id, leaderName: row.leader_name, meetingDate: row.meeting_date,
          submittedAt: row.submitted_at, summary: row.summary,
          fileRef: row.file_path ? { path: row.file_path, name: row.file_name } : null,
          reviewRequested: row.review_requested, reviewed: row.reviewed,
          steps: row.steps || {}, changes: row.changes || []
        };
      });

      ui.ready = true;
      render();
    } catch (err) {
      ui.ready = "error";
      ui.loadError = (err && err.message) || String(err);
      render();
    }
  }

  function subscribeRealtime() {
    if (!sb) return;
    sb.channel("public:pathway")
      .on("postgres_changes", { event: "*", schema: "public", table: "teams" }, function () { loadState(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "submissions" }, function () { loadState(); })
      .subscribe();
  }

  // ---------- render: shared bits ----------

  function statusPill(status) { return "<span class=\"pill " + STATUS_PILL_CLASS[status] + "\"><span class=\"pill-dot\"></span>" + STATUS_LABEL[status] + "</span>"; }

  function progressBar(counts) {
    var total = counts.total || 1;
    var html = "<div class=\"bar\">";
    html += "<div class=\"bar-seg done\" style=\"width:" + (counts.done / total * 100) + "%\"></div>";
    html += "<div class=\"bar-seg doing\" style=\"width:" + (counts.doing / total * 100) + "%\"></div>";
    html += "</div><div class=\"bar-legend\">";
    html += "<span><i class=\"sw done\"></i>" + counts.done + " completed</span>";
    html += "<span><i class=\"sw doing\"></i>" + counts.doing + " in progress</span>";
    html += "<span><i class=\"sw todo\"></i>" + counts.todo + " not started</span></div>";
    return html;
  }

  function readonlyStepList(team, steps) {
    var html = "";
    stagesOf(team).forEach(function (stage) {
      html += "<div class=\"stage-group\"><div class=\"stage-title\">" + escapeHtml(stage) + "</div>";
      team.milestones.filter(function (m) { return m.stage === stage; }).forEach(function (m) {
        var s = steps[m.id] || { status: "not_started", help: false };
        html += "<div class=\"step-view-row\"><span class=\"step-view-label\">" + escapeHtml(m.label) + "</span><span class=\"step-view-badges\">";
        if (s.help && s.status !== "completed") html += "<span class=\"pill pill-danger\"><span class=\"pill-dot\"></span>Needs help</span>";
        html += statusPill(s.status) + "</span></div>";
      });
      html += "</div>";
    });
    return html;
  }

  function formStepList(team, steps) {
    var html = "";
    stagesOf(team).forEach(function (stage) {
      html += "<div class=\"stage-group\"><div class=\"stage-title\">" + escapeHtml(stage) + "</div>";
      team.milestones.filter(function (m) { return m.stage === stage; }).forEach(function (m) {
        var s = steps[m.id] || { status: "not_started", help: false };
        html += "<div class=\"step-row\" data-milestone-id=\"" + m.id + "\">";
        html += "<span class=\"step-label\">" + escapeHtml(m.label) + "</span>";
        html += "<select class=\"step-status\">";
        html += "<option value=\"not_started\"" + (s.status === "not_started" ? " selected" : "") + ">Not started</option>";
        html += "<option value=\"in_progress\"" + (s.status === "in_progress" ? " selected" : "") + ">In progress</option>";
        html += "<option value=\"completed\"" + (s.status === "completed" ? " selected" : "") + ">Completed</option>";
        html += "</select><label class=\"step-help-label\"><input type=\"checkbox\" class=\"step-help\"" + (s.help ? " checked" : "") + " /> Need help</label></div>";
      });
      html += "</div>";
    });
    return html;
  }

  function changesList(changes) {
    if (!changes.length) return "<span class=\"pill pill-neutral\">No checklist changes</span>";
    return changes.map(function (c) {
      if (c.to === "completed") return "<span class=\"pill pill-success\"><span class=\"pill-dot\"></span>" + escapeHtml(c.label) + "</span>";
      if (c.to === "in_progress") return "<span class=\"pill pill-info\"><span class=\"pill-dot\"></span>" + escapeHtml(c.label) + "</span>";
      if (c.help) return "<span class=\"pill pill-danger\"><span class=\"pill-dot\"></span>" + escapeHtml(c.label) + " flagged for help</span>";
      return "<span class=\"pill pill-neutral\"><span class=\"pill-dot\"></span>" + escapeHtml(c.label) + "</span>";
    }).join("");
  }

  function headerHtml() {
    var html = "<header class=\"site-header\"><div class=\"brand-row\">";
    html += "<div class=\"brand\"><strong>" + escapeHtml(META.org) + "</strong><span>&middot;</span><span>" + escapeHtml(META.tag) + "</span></div>";
    if (ui.view === "entry") html += "<a class=\"nav-link\" href=\"#admin\">Admin</a>";
    else html += "<a class=\"nav-link\" href=\"#\">Back to board</a>";
    html += "</div><span class=\"eyebrow\">" + escapeHtml(META.eyebrow) + "</span>";
    html += "<h1 class=\"title\">" + escapeHtml(META.title) + "</h1><p class=\"subtitle\">" + escapeHtml(META.subtitle) + "</p></header>";
    return html;
  }

  function rosterDisplay(team) {
    var roster = team.roster || { members: [], cadence: "" };

    var html = "<div class=\"mini-list\"><div class=\"mini-list-title\">Roster</div>";

    html += "<div class=\"field\"><label>Team members, one per line</label><textarea class=\"roster-members-input\" rows=\"5\" placeholder=\"Jane Doe - Lead\nJohn Smith\">" + escapeHtml(members.join("\n")) + "</textarea></div>";

  // ---------- render: entry view ----------

  function renderEntryView() {
    var teamOptions = "<option value=\"\">Choose your team...</option>";
    state.teams.forEach(function (t) { teamOptions += "<option value=\"" + t.id + "\"" + (ui.selectedTeamId === t.id ? " selected" : "") + ">" + escapeHtml(t.name) + "</option>"; });

      formBlock += "<form id=\"entry-form\" autocomplete=\"off\"><div class=\"field-row\">";

      formBlock += "<div class=\"field\"><label for=\"meetingDate\">Date you met</label><input type=\"date\" id=\"meetingDate\" required /></div></div>";
      formBlock += "<div class=\"field\"><label>Checklist</label><details class=\"checklist\" id=\"checklist-details\" open><summary>" + team.milestones.length + " steps <span class=\"car\">▸</span></summary><div class=\"checklist-body\" id=\"checklist-body\">" + formStepList(team, stats.steps) + "</div></details></div>";
      formBlock += "<div class=\"field\"><label for=\"summary\">What happened this meeting</label><textarea id=\"summary\" placeholder=\"Summarize what you covered, decided, or accomplished\" required></textarea></div>";
      formBlock += "<div class=\"field\"><label for=\"fileInput\">Attach a document (optional)</label><input type=\"file\" id=\"fileInput\" /></div>";
      formBlock += "<div class=\"field checkline\"><input type=\"checkbox\" id=\"reviewRequested\" disabled /><label for=\"reviewRequested\">Submit this file to Jutty for review</label></div>";
      var flashClass = "msg", flashText = "";
      if (ui.flashMessage && ui.flashMessage.teamId === team.id) {
        flashClass = "msg " + ui.flashMessage.kind + " show";

        ui.flashMessage = null;
      }
      formBlock += "<button type=\"submit\" class=\"btn btn-primary\" id=\"submitBtn\">Post update</button><div class=\"" + flashClass + "\" id=\"formMsg\">" + flashText + "</div></form></div>";
    }

    var html = headerHtml();
    html += "<div class=\"card\"><h2 class=\"section-title\">Select your team</h2><p class=\"section-hint\">Pick your Category Team to see current status and log an update.</p>";
    html += "<select id=\"teamSelect\">" + teamOptions + "</select></div>";
    html += progressBlock + formBlock;
    html += "<footer class=\"foot\"><span>" + escapeHtml(META.org) + "</span><span>Updates post immediately, no approval needed.</span></footer>";
    return html;
  }

  function renderPinView() {
    var html = headerHtml();
    html += "<div class=\"pin-wrap\"><div class=\"card\"><h2 class=\"section-title\">Admin access</h2><p class=\"section-hint\">Enter the PIN to see progress across every team.</p>";
    html += "<input type=\"text\" inputmode=\"numeric\" maxlength=\"6\" id=\"pinInput\" placeholder=\"......\" />";
    html += "<div style=\"margin-top:14px\"><button class=\"btn btn-primary\" id=\"pinSubmit\">Unlock</button></div>";
    if (ui.pinError) html += "<div class=\"msg error show\">" + escapeHtml(ui.pinError) + "</div>";
    html += "</div></div>";
    return html;
  }

  function renderAdminView() {
    var allStats = state.teams.map(function (t) { return { team: t, stats: teamStats(t) }; });
    var helpCount = allStats.filter(function (x) { return x.stats.flag === "help"; }).length;
    var stalledCount = allStats.filter(function (x) { return x.stats.flag === "stalled"; }).length;
    var reviewCount = 0; allStats.forEach(function (x) { reviewCount += x.stats.awaitingReview.length; });

    var order = { help: 0, stalled: 1, ontrack: 2 };
    allStats.sort(function (a, b) { if (order[a.stats.flag] !== order[b.stats.flag]) return order[a.stats.flag] - order[b.stats.flag]; return (a.stats.counts.done / a.stats.counts.total) - (b.stats.counts.done / b.stats.counts.total); });

    var statStrip = "<div class=\"stat-strip\">";
    statStrip += "<div class=\"stat-chip " + (helpCount ? "warn" : "") + "\"><div class=\"num\">" + helpCount + "</div><div class=\"lbl\">Teams need help</div></div>";
    statStrip += "<div class=\"stat-chip " + (stalledCount ? "warn" : "") + "\"><div class=\"num\">" + stalledCount + "</div><div class=\"lbl\">Teams behind</div></div>";
    statStrip += "<div class=\"stat-chip " + (reviewCount ? "info" : "") + "\"><div class=\"num\">" + reviewCount + "</div><div class=\"lbl\">Awaiting review</div></div>";
    statStrip += "<div class=\"stat-chip\"><div class=\"num\">" + state.teams.length + "</div><div class=\"lbl\">Teams tracked</div></div></div>";

    var cards = "";
    allStats.forEach(function (x) {
      var team = x.team, stats = x.stats;
      var flagPill = stats.flag === "help" ? "<span class=\"flag-pill flag-help\">Needs help</span>" : stats.flag === "stalled" ? "<span class=\"flag-pill flag-stalled\">Behind</span>" : "<span class=\"flag-pill flag-ontrack\">On track</span>";

      var reviewHtml = "";
      if (stats.awaitingReview.length) {
        reviewHtml = "<div class=\"mini-list\"><div class=\"mini-list-title\">Awaiting review</div>";
        stats.awaitingReview.forEach(function (sub) {
          reviewHtml += "<div class=\"mini-item\"><span><span class=\"who\">" + escapeHtml(sub.leaderName) + "</span> " + (sub.fileRef ? escapeHtml(sub.fileRef.name) : "file") + "</span>";
          reviewHtml += "<button class=\"btn btn-ghost btn-small\" data-mark-reviewed=\"" + sub.id + "\">Mark reviewed</button></div>";
        });
        reviewHtml += "</div>";
      }

      var logHtml = "";
      if (stats.subs.length) {
        var recent = stats.subs.slice().reverse();
        logHtml = "<details class=\"checklist\" style=\"margin-top:14px\"><summary>Activity log (" + stats.subs.length + ") <span class=\"car\">▸</span></summary><div class=\"checklist-body\"><div class=\"log-list\">";
        recent.forEach(function (sub) {
          logHtml += "<div class=\"log-item\"><div class=\"log-item-head\"><span class=\"log-item-who\">" + escapeHtml(sub.leaderName) + "</span><span class=\"log-item-date\">Met " + formatDatePretty(sub.meetingDate) + " &middot; logged " + formatDateTimePretty(sub.submittedAt) + "</span></div>";
          logHtml += "<p class=\"log-item-summary\">" + escapeHtml(sub.summary) + "</p><div class=\"log-item-changes\">" + changesList(sub.changes || []) + "</div>";
          if (sub.fileRef) {
            logHtml += "<div class=\"log-item-file\"><a href=\"" + escapeHtml(sub.fileRef.path) + "\" target=\"_blank\" rel=\"noopener\">" + escapeHtml(sub.fileRef.name) + "</a>";
            if (sub.reviewRequested) logHtml += sub.reviewed ? " <span class=\"pill pill-success\">Reviewed</span>" : " <span class=\"pill pill-info\">Needs review</span>";
            logHtml += "</div>";
          }
          logHtml += "<div class=\"log-item-actions\"><button type=\"button\" class=\"btn btn-ghost btn-small btn-danger-ghost\" data-delete-submission=\"" + sub.id + "\">Delete</button></div></div>";
        });
        logHtml += "</div></div></details>";
      } else logHtml = "<p class=\"empty-note\">No meetings logged yet.</p>";

      cards += "<div class=\"team-card\"><div class=\"team-card-head\"><div><h3>" + escapeHtml(team.name) + "</h3><div class=\"team-meta\" style=\"margin-top:0\">";
      cards += "<span>" + stats.count + " meeting" + (stats.count === 1 ? "" : "s") + "</span><span>Last met " + (stats.lastMeetingDate ? formatDatePretty(stats.lastMeetingDate) : "—") + "</span>";
      if (stats.avgGap !== null) cards += "<span>~" + stats.avgGap + "d apart</span>";
      cards += "</div></div>" + flagPill + "</div>" + progressBar(stats.counts) + rosterDisplay(team) + reviewHtml + logHtml + "</div>";
    });

    var lockRow = "<div style=\"display:flex;justify-content:flex-end;margin-bottom:14px\"><button type=\"button\" class=\"btn btn-ghost btn-small\" id=\"lockAdminBtn\">Lock admin</button></div>";
    return headerHtml() + lockRow + statStrip + cards;
  }

  // ---------- app shell ----------

  function render() {
    if (startupError) {
      app.innerHTML = headerHtml() + "<div class=\"card\"><h2 class=\"section-title\">Something went wrong loading the page</h2><p class=\"section-hint\">" + escapeHtml(startupError) + "</p></div>";
      return;
    }
    if (ui.ready === "unconfigured") {
      app.innerHTML = headerHtml() + "<div class=\"card\"><h2 class=\"section-title\">Almost there</h2><p class=\"section-hint\">This page needs its Supabase project connected. Open <code>config.js</code>, paste in your project URL and anon key, redeploy, and reload this page.</p></div>";
      return;
    }
    if (ui.ready === "error") {
      app.innerHTML = headerHtml() + "<div class=\"card\"><h2 class=\"section-title\">Couldn't load the board</h2><p class=\"section-hint\">" + escapeHtml(ui.loadError || "Unknown error.") + "</p><p class=\"section-hint\">Check that the SQL setup script has been run in your Supabase project, and that config.js has the right URL and key.</p></div>";
      return;
    }
    if (!ui.ready) { app.innerHTML = "<p class=\"loading-note\">Loading the board…</p>"; return; }

    if (ui.view === "admin" && !ui.adminUnlocked) { app.innerHTML = renderPinView(); wirePin(); return; }
    if (ui.view === "admin") { app.innerHTML = renderAdminView(); wireAdminActions(); return; }
    app.innerHTML = renderEntryView(); wireEntry();
  }

  // ---------- entry wiring ----------

  function wireEntry() {
    var select = document.getElementById("teamSelect");
    if (select) select.addEventListener("change", function () { ui.selectedTeamId = select.value; render(); });

    var fileInput = document.getElementById("fileInput");
    var reviewCheckbox = document.getElementById("reviewRequested");
    if (fileInput && reviewCheckbox) {
      fileInput.addEventListener("change", function () {
        if (fileInput.files && fileInput.files.length) reviewCheckbox.disabled = false;
        else { reviewCheckbox.disabled = true; reviewCheckbox.checked = false; }
      });
    }
    var form = document.getElementById("entry-form");
    if (form) form.addEventListener("submit", onSubmit);
  }

  function setFormMsg(text, kind) {
    var el = document.getElementById("formMsg"); if (!el) return;
    el.textContent = text; el.className = "msg " + kind + " show";
  }

  async function onSubmit(evt) {
    evt.preventDefault();
    var team = teamById(ui.selectedTeamId);
    if (!team || !sb) return;

    var leaderName = document.getElementById("leaderName").value.trim();
    var meetingDate = document.getElementById("meetingDate").value;
    var summary = document.getElementById("summary").value.trim();
    var fileInput = document.getElementById("fileInput");
    var reviewRequested = document.getElementById("reviewRequested").checked;
    var file = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

    if (!leaderName || !meetingDate || !summary) { setFormMsg("Fill in your name, meeting date, and a short summary.", "error"); return; }
    if (reviewRequested && !file) { setFormMsg("Attach a file before submitting it for review.", "error"); return; }

    var newSteps = {};
    document.querySelectorAll("#checklist-body .step-row").forEach(function (row) {
      newSteps[row.getAttribute("data-milestone-id")] = { status: row.querySelector(".step-status").value, help: row.querySelector(".step-help").checked };
    });
    var changes = diffSteps(currentSteps(team, submissionsForTeam(team.id)), newSteps, team.milestones);

    var submitBtn = document.getElementById("submitBtn");
    if (submitBtn) submitBtn.disabled = true;
    setFormMsg("Posting...", "info");

    try {
      var fileRef = null;
      if (file) {
        var path = team.id + "/" + Date.now() + "-" + slugify(file.name);
        var upload = await sb.storage.from("documents").upload(path, file);
        if (upload.error) throw upload.error;
        var pub = sb.storage.from("documents").getPublicUrl(path);
        fileRef = { path: pub.data.publicUrl, name: file.name };
      }

      var insertRes = await sb.from("submissions").insert({
        team_id: team.id, leader_name: leaderName, meeting_date: meetingDate,
        summary: summary, file_path: fileRef ? fileRef.path : null, file_name: fileRef ? fileRef.name : null,
        review_requested: !!reviewRequested, reviewed: false, steps: newSteps, changes: changes
      });
      if (insertRes.error) throw insertRes.error;

      ui.flashMessage = { teamId: team.id, text: "Update posted. Your progress above is up to date.", kind: "success" };
      await loadState();
    } catch (err) {
      setFormMsg("Couldn't post that update: " + ((err && err.message) || "unknown error"), "error");
      if (submitBtn) submitBtn.disabled = false;
    }
  }

  // ---------- pin wiring ----------

  function wirePin() {
    var input = document.getElementById("pinInput"); var btn = document.getElementById("pinSubmit");
    if (input) { input.focus(); input.addEventListener("keydown", function (e) { if (e.key === "Enter") attemptUnlock(input.value); }); }
    if (btn) btn.addEventListener("click", function () { attemptUnlock(input ? input.value : ""); });
  }

  function attemptUnlock(value) {
    if (String(value || "").trim() === String(CFG.ADMIN_PIN || "")) {
      ui.adminUnlocked = true; ui.pinError = "";
      try { sessionStorage.setItem(ADMIN_UNLOCK_KEY, "1"); } catch (e) {}
      render();
    } else { ui.pinError = "That PIN does not match. Try again."; render(); }
  }

  // ---------- admin wiring ----------

  function wireAdminActions() {
    document.querySelectorAll("[data-mark-reviewed]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        btn.disabled = true; btn.textContent = "Saving...";
        var res = await sb.from("submissions").update({ reviewed: true }).eq("id", btn.getAttribute("data-mark-reviewed"));
        if (res.error) { btn.disabled = false; btn.textContent = "Mark reviewed"; return; }
        await loadState();
      });
    });

    document.querySelectorAll("[data-save-roster]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var teamId = btn.getAttribute("data-save-roster");
        var container = btn.closest(".roster-edit");
        var cadence = container.querySelector(".roster-cadence-input").value.trim();
        var members = container.querySelector(".roster-members-input").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
        btn.disabled = true; btn.textContent = "Saving...";
        var res = await sb.from("teams").update({ roster_cadence: cadence, roster_members: members }).eq("id", teamId);
        btn.disabled = false; btn.textContent = "Save roster";
        if (!res.error) await loadState();
      });
    });

    document.querySelectorAll("[data-delete-submission]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        if (btn.getAttribute("data-confirm") === "1") {
          btn.disabled = true; btn.textContent = "Deleting...";
          var res = await sb.from("submissions").delete().eq("id", btn.getAttribute("data-delete-submission"));
          if (res.error) { btn.disabled = false; btn.textContent = "Delete"; return; }
          await loadState();
        } else {
          btn.setAttribute("data-confirm", "1"); btn.textContent = "Confirm delete?"; btn.classList.add("btn-danger-confirm");
          if (btn._t) clearTimeout(btn._t);
          btn._t = setTimeout(function () { btn.setAttribute("data-confirm", "0"); btn.textContent = "Delete"; btn.classList.remove("btn-danger-confirm"); }, 4000);
        }
      });
    });

    var lockBtn = document.getElementById("lockAdminBtn");
    if (lockBtn) lockBtn.addEventListener("click", function () { ui.adminUnlocked = false; try { sessionStorage.removeItem(ADMIN_UNLOCK_KEY); } catch (e) {} render(); });
  }

  window.addEventListener("hashchange", function () {
    ui.view = locationView();
    if (ui.view === "admin" && !ui.adminUnlocked) { try { ui.adminUnlocked = sessionStorage.getItem(ADMIN_UNLOCK_KEY) === "1"; } catch (e) {} }
    render();
  });

  if (startupError) {
    render();
  } else {
    loadState();
    subscribeRealtime();
  }
})();
</script>
</body>
</html>
