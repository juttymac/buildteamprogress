    c.forEach(t=>{
      const note=(A.claims.find(x=>x.team_id===t.id&&x.indicator===i.id)||{}).note;
      const linked=A.steps.filter(s=>s.team_id===t.id&&(s.indicators||[]).includes(i.id));
      h+="<p><b>"+esc(t.name)+"</b>"+(note?'<br><span class="sub">Potential steps: '+esc(note)+"</span>":"")+(linked.length?'<br><span class="sub">Linked steps: '+linked.map(s=>esc(s.name)).join("; ")+"</span>":"")+"</p>";
    });
    if(c.length>1)h+='<p class="note">Overlap. Decide whether this is shared on purpose or needs one owner.</p>';
    h+="</div>";
  }
  h+='<div class="flaglist" style="margin-top:1.4rem"><details open><summary>Unclaimed ('+gap.length+")</summary><ul>"+gap.map(i=>"<li>"+esc(indLabel(i))+" — "+esc(i.text)+"</li>").join("")+"</ul></details><details><summary>Overlap ("+over.length+")</summary><ul>"+over.map(i=>"<li>"+esc(indLabel(i))+" — "+claimersOf(i.id).map(t=>esc(t.abbr)).join(", ")+"</li>").join("")+"</ul></details></div>";
  return h;
}
function teamsTab(){
  const A=S.admin;
  let h='<div class="tabs" role="tablist">'+A.teams.map(t=>'<button role="tab" data-a="ateam" data-v="'+t.id+'" aria-selected="'+(t.id===S.adminTeam)+'"><b>'+esc(t.name)+"</b><span>"+(t.kind==="category"?A.claims.filter(c=>c.team_id===t.id).length+" claimed · ":"")+A.steps.filter(s=>s.team_id===t.id).length+" steps</span></button>").join("")+"</div>";
  return h+workspace(adminTeamData(S.adminTeam),true);
}
function allSteps(){
  const A=S.admin;
  const opts=STAGES.map((s,i)=>[String(i),s.name]).concat([["am","Assimilation & Membership"]]);
  const cur=S.stepsStage;
  let h='<div class="tabs" role="tablist">'+opts.map(([k,l])=>'<button role="tab" data-a="sstage" data-v="'+k+'" aria-selected="'+(String(cur)===k)+'"><b>'+esc(l)+"</b><span>"+(k==="am"?A.steps.filter(s=>s.team_id==="assim").length:A.steps.filter(s=>s.team_id!=="assim"&&s.unit===+k).length)+" steps</span></button>").join("")+"</div>";
  const list=cur==="am"?A.steps.filter(s=>s.team_id==="assim"):A.steps.filter(s=>s.team_id!=="assim"&&s.unit===+cur);
  if(list.length){
    const staff=list.filter(x=>x.ideal_leader==="Elder/Staff").length;
    const tools=list.filter(x=>x.tool&&x.tool.trim()).length;
    h+=spaceViz(list,cur!=="am",cur==="am"?-1:+cur);
    h+='<p class="sub">Elder/Staff-led ideals: '+staff+" of "+list.length+" · Tools named: "+tools+" of "+list.length+"</p>";
  }else h+='<div class="empty">No steps here yet.</div>';
  A.teams.filter(t=>list.some(s=>s.team_id===t.id)).forEach(t=>{
    const mine=list.filter(x=>x.team_id===t.id);
    h+='<h3 style="margin:1.2rem 0 .4rem">'+esc(t.name)+"</h3>"+spaceBar(spaceCounts(mine,"ideal_space"),mine.length,"","",true);
    const U=unitsOf(t.kind);
    list.filter(s=>s.team_id===t.id).forEach(s=>{h+=(cur==="am"?'<p class="sub" style="margin:.2rem 0">'+esc(U[s.unit].name)+"</p>":"")+stepCard(s,true);});
  });
  return h;
}
function linksTab(){
  const A=S.admin;
  const base=DEMO?"https://your-site.example/":location.origin+"/";
  let h='<p class="note">Each team’s link is just your site address plus a name. Anyone who knows or guesses a team’s link can open and edit that team’s workspace, so share them only with the teams. You can rename any link below.</p>';
  A.teams.forEach(t=>{
    h+='<div class="linkrow"><b class="sans" style="font-size:.78rem;letter-spacing:.06em;text-transform:uppercase">'+esc(t.name)+'</b><div class="slug"><span>'+esc(base)+'</span><input id="lk-'+t.id+'" value="'+esc(t.token)+'" aria-label="Link name for '+esc(t.name)+'" maxlength="60"><button class="btn small ghost" data-a="saveLink" data-id="'+t.id+'"'+(DEMO?" disabled":"")+'>Save</button><button class="btn small" data-a="copyLink" data-v="'+esc(t.token)+'">Copy link</button></div></div>';
  });
  h+='<p class="sub">Link names use lowercase letters, numbers, and dashes. Your own admin address is separate and unchanged.</p>';
  h+='<h3 style="margin:1.8rem 0 .6rem">Export for analysis</h3><div class="row"><button class="btn" data-a="exportJson">Download everything (JSON)</button><button class="btn ghost" data-a="exportCsv">Download steps (CSV)</button><button class="btn ghost" data-a="copyJson">Copy JSON</button></div>'+(S.msg?'<p class="sub" role="status">'+esc(S.msg)+"</p>":"");
  return h;
}

/* ============ ACTIONS ============ */
function download(name,text,type){
  const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportData(){
  const A=S.admin;
  return {exportedAt:new Date().toISOString(),indicators:INDS,teams:A.teams.map(t=>({id:t.id,name:t.name,abbr:t.abbr,kind:t.kind,claim_done:t.claim_done,units_done:t.units_done})),claims:A.claims,steps:A.steps,progress:A.progress};
}
function exportCsv(){
  const A=S.admin,rows=[["Team","Stage or component","Step","What it is and why","Ideal space","Ideal leader","Secondary space","Secondary leader","Tool","Tool source","Addresses","Principles"]];
  A.steps.forEach(s=>{const t=A.teams.find(x=>x.id===s.team_id);const U=unitsOf(t.kind);rows.push([t.name,U[s.unit].name,s.name,s.description,s.ideal_space,s.ideal_leader,s.secondary_space||"",s.secondary_leader||"",s.tool||"",s.tool_kind||"",(s.indicators||[]).map(short).join("; "),(s.principles||[]).join("; ")]);});
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
async function refreshAdmin(){
  setSave("saving");
  try{const d=await api.adminGet(S.key);if(d.error)throw new Error(d.error);S.admin=d;S.progress=d.progress;setSave("saved");render();}catch(e){setSave("error");}
}
function flushNotes(){
  Object.keys(noteTimers).forEach(id=>{clearTimeout(noteTimers[id]);delete noteTimers[id];const el=document.querySelector('[data-note="'+id+'"]');if(el)saveNote(id,el.value);});
}
function saveNote(id,val){
  if(S.data&&S.data.claims[id])S.data.claims[id].note=val;
  track(api.claimNote(S.token,id,val)).catch(()=>{});
}
document.addEventListener("input",e=>{
  const id=e.target.dataset&&e.target.dataset.note;if(!id)return;
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(()=>{delete noteTimers[id];saveNote(id,e.target.value);},700);
});
document.addEventListener("focusout",e=>{
  const id=e.target.dataset&&e.target.dataset.note;if(!id)return;
  if(noteTimers[id]){clearTimeout(noteTimers[id]);delete noteTimers[id];saveNote(id,e.target.value);}
});
document.addEventListener("change",e=>{
  if(e.target.id==="demoWho")goDemo(e.target.value,"build");
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el||el.tagName==="SELECT")return;
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  if(el.dataset.key)S.focus=el.dataset.key;
  if(a==="tab"){flushNotes();S.tab=v;S.editing=null;S.confirmDel=null;}
  else if(a==="stage"){flushNotes();S.stage=+v;S.editing=null;S.confirmDel=null;}
  else if(a==="claim"){
    const d=S.data,on=!d.claims[id];
    if(on)d.claims[id]={note:""};else delete d.claims[id];
    render();
    try{await track(api.claimSet(S.token,id,on));}catch(err){if(on)delete d.claims[id];else d.claims[id]={note:""};render();}
    return;
  }
  else if(a==="setFlag"){
    const f=S.data.flags;let was,apply;
    if(v==="claim"){was=f.claim_done;apply=x=>{f.claim_done=x;};}
    else{const n=+v.slice(4);was=(f.units_done||[]).includes(n);if(!was&&!S.checked[n])return;apply=x=>{f.units_done=(f.units_done||[]).filter(u=>u!==n);if(x)f.units_done.push(n);if(x)delete S.checked[n];};}
    apply(!was);render();
    try{await track(api.flagSet(S.token,v,!was));}catch(err){apply(was);render();}
    return;
  }
  else if(a==="toggleCheck"){S.checked[+v]=!S.checked[+v];}
  else if(a==="newStep"){S.editing="new";S.confirmDel=null;S.focus="f-name";}
  else if(a==="edit"){S.editing=id;S.confirmDel=null;}
  else if(a==="cancelStep"){S.editing=null;}
  else if(a==="del"){S.confirmDel=id;}
  else if(a==="delNo"){S.confirmDel=null;}
  else if(a==="delYes"){
    const d=S.data;S.confirmDel=null;
    try{await track(api.stepDelete(S.token,id));d.steps=d.steps.filter(s=>s.id!==id);}catch(err){}
  }
  else if(a==="saveStep"){
    const d=S.data,name=$("f-name").value.trim(),desc=$("f-desc").value.trim();
    if(!name){$("f-err").textContent="Give the step a name.";$("f-name").focus();return;}
    if(!desc){$("f-err").textContent="Say what it is and why it’s here.";$("f-desc").focus();return;}
    const step={unit:S.stage,name,description:desc,ideal_space:$("f-is").value,ideal_leader:$("f-il").value,secondary_space:$("f-ss").value,secondary_leader:$("f-sl").value,tool:$("f-tool").value.trim(),tool_kind:$("f-tk").value,indicators:[...document.querySelectorAll("#f-inds input:checked")].map(x=>x.value),principles:[...document.querySelectorAll("#f-prs input:checked")].map(x=>x.value)};
    if(id)step.id=id;
    el.disabled=true;
    try{
      const r=await track(api.stepSave(S.token,step));
      const saved=Object.assign({},step,{id:r.id,secondary_space:step.secondary_space||null,secondary_leader:step.secondary_leader||null,tool_kind:step.tool_kind||null,updated_at:new Date().toISOString()});
      const i=d.steps.findIndex(s=>s.id===r.id);
      if(i>=0)d.steps[i]=Object.assign(d.steps[i],saved);else d.steps.push(saved);
      S.editing=null;
    }catch(err){el.disabled=false;$("f-err").textContent="Couldn’t save. Check your connection and try again.";return;}
  }
  else if(a==="atab"){S.adminTab=v;S.sel=null;S.msg="";S.tab="ws";S.stage=0;}
  else if(a==="ateam"){S.adminTeam=v;S.tab="ws";S.stage=0;}
  else if(a==="sstage"){S.stepsStage=v==="am"?"am":+v;}
  else if(a==="sel"){S.sel=S.sel===id?null:id;}
  else if(a==="refresh"){await refreshAdmin();return;}
  else if(a==="saveLink"){
    const val=$("lk-"+id).value.trim().toLowerCase();
    try{
      const r=await track(api.adminSetToken(S.key,id,val));
      S.admin.teams.find(t=>t.id===id).token=r.token;S.msg="Link saved.";
    }catch(err){S.msg=({taken:"That link is already in use.",bad_format:"Use 3 to 60 lowercase letters, numbers, and dashes.",bad_key:"Couldn’t verify admin access."})[err.message]||"Couldn’t save the link.";}
  }
  else if(a==="copyLink"){try{await navigator.clipboard.writeText(location.origin+"/"+v);S.msg="Link copied.";}catch(err){S.msg="Couldn’t copy. Select the link and copy it by hand.";}}
  else if(a==="exportJson"){try{download("pathway-build-export.json",JSON.stringify(exportData(),null,2),"application/json");S.msg="";}catch(err){S.msg="Download isn’t available here. Use Copy JSON.";}}
  else if(a==="exportCsv"){try{download("pathway-steps.csv",exportCsv(),"text/csv");S.msg="";}catch(err){S.msg="Download isn’t available here.";}}
  else if(a==="copyJson"){try{await navigator.clipboard.writeText(JSON.stringify(exportData(),null,2));S.msg="Copied. Paste it into chat for analysis.";}catch(err){S.msg="Couldn’t copy here.";}}
  render();
});
setInterval(()=>{if(!document.hidden&&(S.mode==="team"||S.mode==="admin"))refreshProgress();},60000);
boot();

</script>
