<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disciple-Making Pathway Build Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F5F2EC; --surface:#FFFFFF; --ink:#494744; --ink-soft:#6B6862; --line:#D9D3C4;
  --gold:#9C9067; --gold-deep:#7D724F; --gold-tint:#EBE5D4; --gold-wash:#F8F5EC;
  --gap:#A4472F; --gap-tint:#F5E6E0; --on-deep:#FFFFFF;
  --over-bg:#7D724F; --over-fg:#FFFFFF;
  --bar-bg:#494744; --bar-fg:#FFFFFF; --bar-gold:#CDBF8C; --focus:#494744;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#262524; --surface:#31302D; --ink:#F1EEE7; --ink-soft:#BDB8AD; --line:#4B4742;
    --gold:#B8AB7C; --gold-deep:#CDBF8C; --gold-tint:#443F33; --gold-wash:#3A372F;
    --gap:#E58A72; --gap-tint:#47302A; --on-deep:#262524;
    --over-bg:#B8AB7C; --over-fg:#262524;
    --bar-bg:#1C1B1A; --bar-fg:#F1EEE7; --focus:#F1EEE7;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#262524; --surface:#31302D; --ink:#F1EEE7; --ink-soft:#BDB8AD; --line:#4B4742;
  --gold:#B8AB7C; --gold-deep:#CDBF8C; --gold-tint:#443F33; --gold-wash:#3A372F;
  --gap:#E58A72; --gap-tint:#47302A; --on-deep:#262524;
  --over-bg:#B8AB7C; --over-fg:#262524;
  --bar-bg:#1C1B1A; --bar-fg:#F1EEE7; --focus:#F1EEE7;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fanwood Text","Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.55;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar-bg);z-index:30;}
h1,h2,h3,h4{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;margin:0;color:var(--ink);}
h1{font-weight:700;letter-spacing:.06em;font-size:clamp(1.35rem,3.6vw,2rem);line-height:1.2;}
h2{font-weight:700;letter-spacing:.06em;font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.25;}
h3{font-weight:500;letter-spacing:.09em;font-size:.82rem;line-height:1.35;}
h4{font-weight:600;letter-spacing:.06em;font-size:.8rem;line-height:1.4;}
p{margin:0 0 .6em;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.sans{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;}
.lbl{color:var(--ink-soft);font-size:.95rem;}
.sub{font-size:.92rem;color:var(--ink-soft);}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar-bg);color:var(--bar-fg);}
.bar-in{max-width:1100px;margin:0 auto;padding:.7rem 1.1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;line-height:1.15;}
.brand b{font-family:"Montserrat",sans-serif;font-weight:700;letter-spacing:.14em;font-size:.95rem;text-transform:uppercase;}
.brand span{font-family:"Montserrat",sans-serif;font-weight:500;letter-spacing:.12em;font-size:.62rem;color:var(--bar-gold);text-transform:uppercase;margin-top:.2rem;}
.bar-r{display:flex;align-items:center;gap:.8rem;font-size:.9rem;}
.who{color:var(--bar-gold);}
#savechip{font-family:"Montserrat",sans-serif;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--bar-gold);padding:.15rem .5rem;border-radius:2px;color:var(--bar-gold);min-width:5.2rem;text-align:center;}
#savechip.err{background:var(--gap);border-color:var(--gap);color:#fff;}
.demo{background:var(--gold-tint);border-bottom:1px solid var(--line);font-size:.9rem;}
.demo-in{max-width:1100px;margin:0 auto;padding:.4rem 1.1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;}
.demo select{background:var(--surface);border:1px solid var(--line);padding:.25rem .4rem;border-radius:2px;}

main{max-width:1100px;margin:0 auto;padding:1.6rem 1.1rem 4rem;}
.pull{font-style:italic;color:var(--gold-deep);font-size:1.2rem;line-height:1.4;border-left:3px solid var(--gold);padding:.1rem 0 .1rem 1rem;margin:1rem 0 1.2rem;max-width:68ch;}
.note{border-left:3px solid var(--gold);background:var(--gold-wash);padding:.6rem .9rem;margin:0 0 1rem;font-size:.97rem;}
.note.warn{border-left-color:var(--gap);background:var(--gap-tint);}

.btn{font-family:"Montserrat",sans-serif;font-weight:600;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;background:var(--gold-deep);color:var(--on-deep);border:1px solid var(--gold-deep);padding:.65rem 1rem;border-radius:2px;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink-soft);}
.btn.small{padding:.4rem .65rem;font-size:.62rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.link{background:none;border:0;padding:0;color:var(--gold-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.95rem;}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:1rem 0;}

.mainnav{display:flex;gap:4px;margin:1.2rem 0 0;border-bottom:1px solid var(--line);}
.mainnav button{background:none;border:0;border-bottom:3px solid transparent;font-family:"Montserrat",sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:.7rem 1rem;cursor:pointer;color:var(--ink-soft);}
.mainnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold);}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:1.2rem 0 1rem;}
.tabs button{flex:1 1 9rem;text-align:left;background:var(--surface);border:1px solid var(--line);padding:.6rem .8rem;cursor:pointer;}
.tabs button b{display:block;font-family:"Montserrat",sans-serif;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;}
.tabs button span{font-size:.9rem;color:var(--ink-soft);}
.tabs button[aria-selected="true"]{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--on-deep);}
.tabs button[aria-selected="true"] span{color:var(--on-deep);}
.stagehead{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:baseline;margin-bottom:1rem;}
.stagehead .say{font-style:italic;color:var(--gold-deep);}

.oc{background:var(--surface);border:1px solid var(--line);margin-bottom:1rem;}
.oc>header{padding:.8rem 1.1rem;border-bottom:1px solid var(--line);background:var(--gold-wash);}
.oc>header p{margin:.25rem 0 0;font-size:.95rem;color:var(--ink-soft);}
.ind{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1rem;align-items:center;border-bottom:1px solid var(--line);}
.ind:last-child{border-bottom:0;}
.ind.on{background:var(--gold-wash);}
.chk{display:grid;grid-template-columns:1.5rem 3.6rem minmax(0,1fr);gap:.7rem;align-items:center;text-align:left;background:none;border:0;padding:.8rem 1.1rem;cursor:pointer;width:100%;}
.chk:disabled{cursor:default;}
.box{width:1.3rem;height:1.3rem;border:2px solid var(--ink-soft);border-radius:2px;display:grid;place-items:center;font-size:.95rem;line-height:1;}
.chk[aria-checked="true"] .box{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--on-deep);}
.chk .dim{font-family:"Montserrat",sans-serif;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);}
.side{display:flex;gap:.4rem;align-items:center;padding-right:1rem;flex-wrap:wrap;justify-content:flex-end;}
.chip{display:inline-block;font-family:"Montserrat",sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.06em;padding:.18rem .42rem;border:1px solid var(--gold);color:var(--gold-deep);border-radius:2px;background:var(--surface);}
.chip.plain{border-color:var(--line);color:var(--ink-soft);}
.notebox{grid-column:1/-1;padding:0 1.1rem .8rem 3.2rem;}

.field{display:flex;flex-direction:column;gap:.2rem;margin-bottom:.7rem;}
.field label{font-size:.95rem;color:var(--ink-soft);}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);padding:.5rem .6rem;border-radius:2px;width:100%;}
.field textarea{min-height:5rem;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;}
.panel{background:var(--surface);border:1px solid var(--line);padding:1.1rem 1.2rem;margin-bottom:1rem;}
.panel h3{margin-bottom:.6rem;}
.formbox{background:var(--surface);border:1px solid var(--gold);padding:1.1rem 1.2rem;margin:1rem 0;}
.formbox fieldset{border:1px solid var(--line);margin:.2rem 0 .8rem;padding:.7rem .9rem .3rem;}
.formbox legend{font-family:"Montserrat",sans-serif;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding:0 .4rem;color:var(--gold-deep);}
.checks{display:flex;flex-direction:column;gap:.3rem;max-height:15rem;overflow:auto;border:1px solid var(--line);padding:.5rem .7rem;background:var(--bg);}
.checks label{display:flex;gap:.55rem;align-items:flex-start;font-size:.95rem;}
.checks input{margin-top:.35rem;}
details.opt{margin:.2rem 0 .8rem;}
details.opt>summary{cursor:pointer;color:var(--gold-deep);font-size:.97rem;margin-bottom:.4rem;}
.err{color:var(--gap);font-size:.95rem;margin:.3rem 0;}

.step{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);padding:.9rem 1.1rem;margin-bottom:.7rem;}
.step header{display:flex;justify-content:space-between;gap:1rem;align-items:start;}
.step .desc{margin:.4rem 0 .6rem;white-space:pre-wrap;}
.lead{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:.2rem .6rem;font-size:.97rem;}
.lead b{font-family:"Montserrat",sans-serif;font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);align-self:center;}
.step .acts{display:flex;gap:.9rem;}
.meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem;}
.empty{padding:1.4rem;border:1px dashed var(--line);color:var(--ink-soft);text-align:center;margin-bottom:.8rem;}
.ref{background:var(--gold-wash);border:1px solid var(--line);margin-bottom:1rem;}
.ref>summary{cursor:pointer;padding:.7rem 1rem;font-family:"Montserrat",sans-serif;font-weight:600;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;}
.ref ul{margin:0;padding:0 1rem .8rem 2.2rem;font-size:.97rem;}
.ref li{margin:.25rem 0;}

.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surface);margin:1.2rem 0 1.6rem;}
.strip div{padding:.9rem 1.1rem;border-right:1px solid var(--line);}
.strip div:last-child{border-right:0;}
.strip b{display:block;font-family:"Montserrat",sans-serif;font-weight:700;font-size:1.6rem;line-height:1.1;}
.strip span{color:var(--ink-soft);font-size:.95rem;}
table.tbl{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.55rem .8rem;text-align:left;vertical-align:top;}
.tbl thead th{font-family:"Montserrat",sans-serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;background:var(--gold-wash);}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--surface);}
.scroll>table.tbl{border:0;}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.92rem;color:var(--ink-soft);margin:.8rem 0 1rem;}
.legend span{display:flex;align-items:center;gap:.4rem;}
.sw{width:1.3rem;height:1rem;display:inline-block;border:1px solid var(--line);}
.sw.gap{border:2px dashed var(--gap);background:var(--gap-tint);}
.sw.one{background:var(--gold-tint);border-color:var(--gold);}
.sw.over{background:var(--over-bg);border-color:var(--over-bg);}
table.heat{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;}
.heat th,.heat td{border-bottom:1px solid var(--line);padding:0;vertical-align:top;}
.heat thead th{background:var(--surface);padding:.6rem;text-align:left;font-family:"Montserrat",sans-serif;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;}
.heat .oh th{background:var(--gold-wash);padding:.55rem .8rem;text-align:left;}
.heat .rl{width:5rem;padding:.6rem .8rem;font-family:"Montserrat",sans-serif;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);}
.cell{display:flex;flex-direction:column;gap:.25rem;width:100%;min-height:3.6rem;text-align:left;border:0;background:var(--gold-tint);padding:.5rem .6rem;cursor:pointer;margin:0;}
.cell.gap{background:var(--gap-tint);box-shadow:inset 0 0 0 2px var(--gap);background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(164,71,47,.1) 7px 9px);}
.cell.over{background:var(--over-bg);color:var(--over-fg);}
.cell.sel{outline:3px solid var(--focus);outline-offset:-3px;}
.cell .chips{display:flex;gap:.25rem;flex-wrap:wrap;}
.cell small{font-size:.82rem;line-height:1.2;}
.cell.gap small{color:var(--gap);font-weight:600;}
.detail{border:1px solid var(--gold);background:var(--surface);padding:1rem 1.2rem;margin:1rem 0;}
.flaglist details{background:var(--surface);border:1px solid var(--line);margin-bottom:.6rem;}
.flaglist summary{cursor:pointer;padding:.7rem 1rem;font-family:"Montserrat",sans-serif;font-weight:600;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;}
.flaglist ul{margin:0;padding:0 1rem .8rem 2.2rem;font-size:.97rem;}
.flaglist li{margin:.25rem 0;}
.linkrow{background:var(--surface);border:1px solid var(--line);padding:.8rem 1rem;margin-bottom:.6rem;}
.linkrow code{display:block;font-size:.8rem;word-break:break-all;color:var(--ink-soft);margin:.3rem 0 .5rem;font-family:ui-monospace,Menlo,monospace;}
.center{max-width:460px;margin:3rem auto;text-align:center;}
.pin{font-family:"Montserrat",sans-serif;font-size:1.6rem;letter-spacing:.6em;text-align:center;width:11rem;background:var(--bg);border:1px solid var(--line);padding:.6rem .4rem .6rem 1rem;border-radius:2px;}
@media (max-width:760px){
  .grid2{grid-template-columns:1fr;}
  .strip{grid-template-columns:1fr 1fr;}
  .strip div:nth-child(2){border-right:0;}
  .strip div:nth-child(-n+2){border-bottom:1px solid var(--line);}
  .ind{grid-template-columns:1fr;}
  .side{justify-content:flex-start;padding:0 1.1rem .7rem 3.6rem;}
  .chk{grid-template-columns:1.5rem minmax(0,1fr);}
  .chk .dim,.chk .txt{grid-column:2;}
  .notebox{padding-left:1.1rem;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ---- progress + tools + links ---- */
details.prog{background:var(--surface);border:1px solid var(--line);margin:0 0 1.4rem;}
details.prog>summary{cursor:pointer;padding:.8rem 1.1rem;font-family:"Montserrat",sans-serif;font-weight:600;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;}
.prows{padding:0 1.1rem .4rem;}
.prow{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 3rem;gap:.2rem 1rem;align-items:center;padding:.7rem 0;border-top:1px solid var(--line);}
.prow.mine{background:var(--gold-wash);margin:0 -1.1rem;padding:.7rem 1.1rem;}
.pname b{font-family:"Montserrat",sans-serif;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;display:block;line-height:1.3;}
.pbar{height:10px;background:var(--gold-tint);border-radius:1px;overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--gold-deep);}
.ppct{font-family:"Montserrat",sans-serif;font-weight:700;font-size:.95rem;text-align:right;}
.pmeta{grid-column:2/4;font-size:.93rem;color:var(--ink-soft);}
.pwork{grid-column:2/4;display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;}
.you{font-family:"Fanwood Text",serif;font-style:italic;color:var(--gold-deep);text-transform:none;letter-spacing:0;font-weight:400;font-size:.9rem;margin-left:.3rem;}
.lead .need{color:var(--gap);}
.done-panel{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:.9rem 1.1rem;margin:1rem 0;}
.done-panel p{margin:0;flex:1 1 16rem;font-size:.97rem;}
.done-panel.ok{border-color:var(--gold);background:var(--gold-wash);}
.slug{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0;}
.slug span{color:var(--ink-soft);font-size:.9rem;}
.slug input{background:var(--bg);border:1px solid var(--line);padding:.4rem .6rem;border-radius:2px;flex:1 1 14rem;max-width:22rem;}
@media (max-width:760px){
  .prow{grid-template-columns:1fr 3rem;}
  .pname{grid-column:1/-1;}
  .pbar{grid-column:1;}
  .pmeta,.pwork{grid-column:1/-1;}
}

.prog-box{background:var(--surface);border:1px solid var(--line);margin:0 0 1.4rem;padding-top:.4rem;}

/* ---- coverage grid ---- */
.covergrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1rem;margin:0 0 1.4rem;align-items:start;}
.covergrid.single{grid-template-columns:minmax(0,1fr);}
.covercol{background:var(--surface);border:1px solid var(--line);}
.covercol>header{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--gold-wash);display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap;}
.crow{display:grid;grid-template-columns:1.2rem minmax(0,1fr) auto;gap:.6rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);font-size:.97rem;align-items:start;}
.crow:last-child{border-bottom:0;}
.crow.on{background:var(--gold-wash);}
.badge{font-family:"Montserrat",sans-serif;font-size:.56rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:.22rem .45rem;border-radius:2px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
.badge.ok{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--on-deep);}
.lead span{white-space:pre-wrap;}
@media (max-width:860px){.covergrid{grid-template-columns:1fr;}}

/* ---- principles in two columns ---- */
.pgrid{display:grid;grid-template-columns:1fr 1fr;}
.pcell{padding:.5rem .8rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;font-size:.93rem;line-height:1.35;}
.pcell .badge{font-size:.5rem;padding:.2rem .35rem;}
.pcell:nth-child(2n){border-right:0;}
.pcell.on{background:var(--gold-wash);}
@media (max-width:600px){.pgrid{grid-template-columns:1fr;}.pcell{border-right:0;}}
/* ---- spaces visual ---- */
.spaces{background:var(--surface);border:1px solid var(--line);margin:0 0 1.4rem;}
.spaces>header{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--gold-wash);display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap;}
.spbody{padding:1rem 1.1rem;}
.sprow{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:.8rem;align-items:center;margin-bottom:.6rem;}
.sprow.nolab{grid-template-columns:minmax(0,1fr);margin-bottom:.8rem;}
.splab{font-family:"Montserrat",sans-serif;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);}
.spbar{display:flex;height:2.3rem;border:1px solid var(--line);overflow:hidden;}
.spbar.mini{height:.9rem;}
.spbar.mini .spseg{font-size:0;min-width:0;}
.spbar.spempty{align-items:center;padding:0 .8rem;color:var(--ink-soft);font-size:.93rem;background:var(--bg);}
.spseg{display:flex;align-items:center;justify-content:center;font-family:"Montserrat",sans-serif;font-weight:700;font-size:.8rem;min-width:1.8rem;}
.spseg+.spseg{border-left:2px solid var(--surface);}
.sp-intimate{background:#7D724F;color:#fff;}
.sp-family{background:#9C9067;color:#1f1e1c;}
.sp-scattered{background:#CFC4A0;color:#1f1e1c;}
.sp-gathered{background:#8E8B85;color:#1f1e1c;}
.sp-divine{background:#494744;color:#fff;}
.splegend{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;padding:0;margin:.8rem 0 0;font-size:.93rem;}
.spsw{display:inline-block;width:.9rem;height:.9rem;margin-right:.4rem;vertical-align:-.1rem;border:1px solid var(--line);}
@media (max-width:860px){.sprow{grid-template-columns:1fr;gap:.2rem;}}

/* ---- checklists below steps ---- */
.secthead{margin:2rem 0 .3rem;padding-top:1.2rem;border-top:1px solid var(--line);}
.checkpanel{background:var(--surface);border:1px solid var(--gold);border-left:4px solid var(--gold-deep);padding:1.1rem 1.2rem;margin:0 0 1.4rem;}
.checkpanel h3{margin-bottom:.4rem;}
.cwlist{list-style:none;margin:.4rem 0 .8rem;padding:0;}
.cwlist li{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.4rem;font-size:.97rem;padding:.15rem 0;}
.cwlist li.no{color:var(--ink-soft);}
.cb{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0;font-size:1rem;}
.cb input{margin-top:.4rem;width:1.05rem;height:1.05rem;}

a.btn{display:inline-block;text-decoration:none;}

/* ---- pathway overview (embedded file) ---- */
.pvframe{display:block;width:100%;height:calc(100vh - 11rem);min-height:560px;border:1px solid var(--line);background:#FAF8F3;}
@media (max-width:860px){.pvframe{height:calc(100vh - 9rem);}}
.mainnav{overflow-x:auto;scrollbar-width:none;}
.mainnav::-webkit-scrollbar{display:none;}
.mainnav button{white-space:nowrap;}
@media (max-width:600px){.mainnav button{padding:.7rem .6rem;font-size:.62rem;letter-spacing:.07em;}}

/* ---- must-check callout ---- */
.mustcheck{background:var(--gold-deep);color:var(--on-deep);padding:1.1rem 1.3rem 1.2rem;margin:.6rem 0 1.2rem;border-left:8px solid var(--ink);box-shadow:0 1px 0 var(--line);}
.mustcheck .mclabel{display:block;font-family:"Montserrat",sans-serif;font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.4rem;opacity:.95;}
.mustcheck p{margin:0;font-size:1.22rem;line-height:1.45;}
.mustcheck b{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;}
@media (max-width:600px){.mustcheck p{font-size:1.1rem;}}

/* ---- complete-state colors (green when all addressed, red when not) ---- */
:root{--ok:#2F6B45;--ok-tint:#E3EFE6;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok:#8FCB9F;--ok-tint:#233A2B;}}
:root[data-theme="dark"]{--ok:#8FCB9F;--ok-tint:#233A2B;}
.done-panel.good{background:var(--ok-tint);border-color:var(--ok);border-left:6px solid var(--ok);}
.done-panel.good p,.done-panel.good b{color:var(--ok);}
.done-panel.bad{background:var(--gap-tint);border-color:var(--gap);border-left:6px solid var(--gap);}
.done-panel.bad p,.done-panel.bad b{color:var(--gap);}
.done-panel .miss{flex:1 1 100%;font-size:.95rem;}
.done-panel.good .btn.ghost{border-color:var(--ok);color:var(--ok);}
.done-panel.bad .btn.ghost{border-color:var(--gap);color:var(--gap);}
</style>
</head>

 margin:0 auto;\n  padding:3vh 6vw 4.5vh;\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  gap:1.3rem;\n}\n\n.mission-block{\n  text-align:center;\n  max-width:660px;\n  animation:fadeUp .9s ease both;\n}\n.mission{\n  font-family:var(--serif);\n  font-style:italic;\n  font-size:clamp(1.25rem,2.4vw,1.7rem);\n  line-height:1.4;\n  color:var(--charcoal);\n  font-weight:400;\n  margin:0;\n}\n\n.how-block{\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  gap:0.6rem;\n  animation:fadeUp 1.1s ease both;\n}\n.how-box{\n  background:var(--charcoal);\n  border-radius:14px;\n  padding:0.85rem 1.6rem;\n  box-shadow:var(--shadow);\n  max-width:640px;\n}\n.how-text{\n  font-family:var(--sans);\n  font-weight:800;\n  font-size:clamp(0.92rem,1.9vw,1.1rem);\n  color:var(--gold-light);\n  text-align:center;\n  line-height:1.3;\n  margin:0;\n}\n\n.hint{\n  text-align:center;\n  font-family:var(--serif);\n  font-style:italic;\n  font-size:0.86rem;\n  color:var(--ink-light);\n  margin:0;\n}\n.hint-inside{\n  margin-top:1.4rem;\n}\n\n/* ============ SPACES BOX ============ */\n.spaces-box{\n  width:min(94vw,880px);\n  background:var(--paper-dim);\n  border:1px solid var(--line);\n  border-radius:22px;\n  padding:1.4rem clamp(1rem,3vw,2rem) 2.2rem;\n  animation:fadeUp 1.2s ease both;\n}\n.section-sub{\n  text-align:center;\n  font-family:var(--serif);\n  font-style:italic;\n  font-size:0.95rem;\n  line-height:1.5;\n  color:var(--ink-light);\n  max-width:600px;\n  margin:0 auto 1.1rem;\n}\n\n.spaces-row{\n  display:grid;\n  grid-template-columns:1fr auto 1fr;\n  align-items:center;\n  column-gap:0.6rem;\n}\n.spaces-row > .space-bubble.quiet:first-child{ justify-self:end; }\n.spaces-row > .space-bubble.quiet:last-child{ justify-self:start; }\n@media (max-width:480px){\n  .spaces-row{\n    display:flex;\n    flex-wrap:wrap;\n    justify-content:center;\n    align-items:center;\n    gap:0.5rem;\n  }\n  .spaces-row > .space-bubble.quiet:first-child{ order:1; }\n  .spaces-row > .space-bubble.quiet:last-child{ order:2; }\n  .spaces-row > .sweet-box-row{ order:3; flex-basis:100%; justify-content:center; }\n}\n.space-bubble{\n  border:1.5px solid var(--line);\n  background:var(--white);\n  border-radius:999px;\n  padding:0.55rem 1.05rem;\n  font-weight:700;\n  font-size:0.82rem;\n  letter-spacing:0.02em;\n  color:var(--charcoal-soft);\n  cursor:pointer;\n  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;\n}\n.space-bubble:hover, .space-bubble:focus-visible{transform:translateY(-1px); box-shadow:var(--shadow);}\n.space-bubble:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}\n.space-bubble.quiet{background:var(--charcoal-wash); border-color:transparent; font-size:0.78rem;}\n.space-bubble.sweet{background:var(--white); border-color:var(--gold-wash-strong); color:var(--gold-deep);}\n.space-bubble.sweet:hover, .space-bubble.sweet:focus-visible{background:var(--gold-wash-strong); border-color:var(--gold);}\n\n.sweet-box-row{\n  display:flex;\n  align-items:center;\n  gap:0.5rem;\n  padding:0.45rem;\n  border:1.5px dashed var(--gold);\n  background:var(--gold-wash);\n  border-radius:999px;\n}\n\n.connector-line{\n  width:1.5px;\n  height:26px;\n  background:var(--gold);\n  margin:0 auto;\n}\n\n.sweet-spot-box{\n  background:var(--tan);\n  border:1.5px solid var(--gold-wash-strong);\n  border-radius:20px;\n  padding:1.3rem 1.4rem 1.6rem;\n  max-width:640px;\n  margin:0 auto;\n  text-align:center;\n}\n.sweet-heading{\n  font-size:1.02rem;\n  font-weight:800;\n  letter-spacing:0.08em;\n  text-transform:uppercase;\n  color:var(--gold-deep);\n  margin:0 0 0.4rem;\n}\n.sweet-caption{\n  font-family:var(--serif);\n  font-style:italic;\n  font-size:0.92rem;\n  line-height:1.5;\n  color:var(--charcoal-soft);\n  margin:0;\n}\n.aid-intro{\n  margin:1.1rem 0 1.3rem;\n}\n.aid-intro p{\n  display:inline-block;\n  font-family:var(--sans);\n  font-weight:500;\n  font-size:0.88rem;\n  color:var(--charcoal);\n  background:var(--white);\n  border:1.5px solid var(--gold);\n  border-radius:999px;\n  padding:0.42rem 1.1rem;\n  margin:0;\n}\n.aid-intro p strong{\n  font-weight:800;\n}\n\n/* ---- AID cycle: shared rectangle styling ---- */\n.aid-rect{\n  background:var(--white);\n  border:1.5px solid var(--gold);\n  border-radius:14px;\n  padding:1.1rem 0.8rem;\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:center;\n  gap:0.15rem;\n  cursor:pointer;\n  box-shadow:0 4px 14px rgba(35,40,43,0.1);\n  text-align:center;\n  color:var(--charcoal);\n  transition:transform .2s ease, background .2s ease, color .2s ease;\n}\n.aid-rect:hover, .aid-rect:focus-visible{ transform:translateY(-2px); background:var(--charcoal); color:var(--white); }\n.aid-rect:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }\n.aid-rect .aid-icon{ width:22px; height:22px; margin-bottom:0.1rem; flex-shrink:0; }\n.aid-rect .aid-icon path, .aid-rect .aid-icon circle, .aid-rect .aid-icon rect, .aid-rect .aid-icon line{ stroke:var(--gold-deep); transition:stroke .2s ease; }\n.aid-rect:hover .aid-icon path, .aid-rect:hover .aid-icon circle, .aid-rect:hover .aid-icon rect, .aid-rect:hover .aid-icon line,\n.aid-rect:focus-visible .aid-icon path, .aid-rect:focus-visible .aid-icon circle, .aid-rect:focus-visible .aid-icon rect, .aid-rect:focus-visible .aid-icon line{ stroke:var(--gold-light); }\n.aid-rect .word{ font-size:1.02rem; font-weight:800; letter-spacing:0.01em; }\n.aid-rect .word .num{ font-size:0.75em; font-weight:700; opacity:0.7; margin-right:0.15rem; }\n.aid-rect .uses{ font-family:var(--serif); font-style:italic; font-size:0.78rem; color:var(--ink-light); }\n.aid-rect:hover .uses, .aid-rect:focus-visible .uses{ color:rgba(255,255,255,0.75); }\n\n/* ---- Desktop / tablet: left to right ---- */\n.aid-flow-desktop{\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  width:100%;\n  margin-top:1.3rem;\n}\n.aid-flow-row{\n  display:flex;\n  align-items:stretch;\n  justify-content:center;\n  gap:0.5rem;\n  width:100%;\n}\n.aid-flow-row .aid-rect{ flex:1; }\n.flow-arrow{\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  color:var(--gold-deep);\n  font-size:1.5rem;\n  font-weight:700;\n  flex-shrink:0;\n  padding:0 0.1rem;\n}\n.loop-back-svg-h{\n  width:100%;\n  height:auto;\n  display:block;\n  margin:0 auto;\n  overflow:visible;\n}\n.loop-back-label{\n  text-align:center;\n  font-size:0.68rem;\n  font-weight:700;\n  letter-spacing:0.14em;\n  text-transform:uppercase;\n  color:var(--gold-deep);\n  margin:0.1rem 0 0;\n}\n\n/* ---- Mobile: top to bottom ---- */\n.aid-flow-mobile{ display:none; }\n@media (max-width: 680px){\n  .aid-flow-desktop{ display:none; }\n  .aid-flow-mobile{\n    display:flex;\n    align-items:stretch;\n    justify-content:center;\n    gap:0.5rem;\n    width:100%;\n    margin-top:1.3rem;\n  }\n  .aid-flow-col{\n    display:flex;\n    flex-direction:column;\n    gap:0.55rem;\n    flex:1;\n    max-width:320px;\n  }\n  .flow-arrow-v{\n    text-align:center;\n    color:var(--gold-deep);\n    font-size:1.4rem;\n    font-weight:700;\n    line-height:1;\n  }\n  .loop-back-svg-v{ width:26px; flex-shrink:0; height:auto; align-self:stretch; overflow:visible; }\n}\n\n/* ============ CONNECTOR (spaces -> vision) ============ */\n.loop-connectors{\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  gap:0.9rem;\n  animation:fadeUp 1.3s ease both;\n}\n.loop-connectors svg{ display:block; width:18px; height:46px; }\n.loop-label{\n  font-size:0.72rem;\n  font-weight:700;\n  letter-spacing:0.14em;\n  text-transform:uppercase;\n  color:var(--gold-deep);\n  white-space:nowrap;\n  text-align:center;\n}\n\n/* ============ VISION BOX ============ */\n.vision-box{\n  width:min(94vw,880px);\n  background:var(--charcoal);\n  border-radius:22px;\n  padding:1.5rem clamp(1rem,3vw,2rem) 1.6rem;\n  text-align:center;\n  animation:fadeUp 1.4s ease both;\n}\n.vision-box .big-header{ color:var(--gold-light); }\n.vision-box .section-sub{ color:rgba(255,255,255,0.68); margin-bottom:1.1rem; }\n.vision-items{\n  display:flex;\n  flex-wrap:wrap;\n  justify-content:center;\n  align-items:center;\n  gap:0.3rem 0;\n}\n.vision-items span{\n  color:var(--white);\n  font-weight:700;\n  font-size:0.92rem;\n  letter-spacing:0.01em;\n  padding:0 0.85rem;\n  white-space:nowrap;\n}\n.vision-items span:not(:last-child){ border-right:1px solid rgba(255,255,255,0.22); }\n\n@keyframes fadeUp{\n  from{opacity:0; transform:translateY(14px);}\n  to{opacity:1; transform:translateY(0);}\n}\n@media (prefers-reduced-motion: reduce){\n  .mission-block,.hint,.spaces-box,.loop-connectors,.vision-box{animation:none;}\n}\n@media (max-width: 640px){\n  .vision-items span{ padding:0.15rem 0.7rem; white-space:normal; }\n  .vision-items span:not(:last-child){ border-right:none; }\n}\n\n/* ============ PANEL & SCRIM ============ */\n.scrim{\n  position:fixed; inset:0;\n  background:rgba(35,40,43,0.42);\n  opacity:0;\n  pointer-events:none;\n  transition:opacity .3s ease;\n  z-index:10;\n}\n.scrim.open{opacity:1; pointer-events:auto;}\n\n.panel{\n  position:fixed;\n  top:0; right:0;\n  height:100%;\n  width:min(92vw,460px);\n  background:var(--white);\n  box-shadow:-14px 0 40px rgba(35,40,43,0.18);\n  transform:translateX(100%);\n  transition:transform .35s cubic-bezier(.2,.8,.2,1);\n  z-index:11;\n  display:flex;\n  flex-direction:column;\n}\n.panel.open{transform:translateX(0);}\n\n.panel-header{\n  padding:1.2rem 1.5rem 0.9rem;\n  border-bottom:1px solid var(--line);\n  display:flex;\n  align-items:flex-start;\n  justify-content:space-between;\n  gap:1rem;\n}\n.panel-label{\n  font-size:0.74rem;\n  font-weight:700;\n  letter-spacing:0.1em;\n  text-transform:uppercase;\n  color:var(--ink-light);\n}\n.panel-close{\n  background:none; border:none; cursor:pointer;\n  font-size:1.3rem; line-height:1;\n  color:var(--ink-light);\n  padding:0.1rem 0.3rem;\n  flex-shrink:0;\n}\n.panel-close:hover, .panel-close:focus-visible{color:var(--charcoal);}\n\n.panel-body{\n  padding:1.4rem 1.5rem 2.4rem;\n  overflow-y:auto;\n  flex:1;\n}\n.panel-eyebrow{\n  font-size:0.7rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;\n  color:var(--gold-deep); margin:0 0 0.4rem;\n}\n.panel-title{\n  font-family:var(--sans); font-weight:800;\n  font-size:1.45rem; color:var(--charcoal);\n  margin:0 0 0.5rem;\n  line-height:1.2;\n}\n.panel-sub{\n  font-family:var(--sans); font-weight:600; font-size:0.78rem;\n  letter-spacing:0.03em; text-transform:uppercase;\n  color:var(--ink-light); margin:0 0 0.8rem;\n}\n.panel-text{\n  font-family:var(--serif); font-size:1.02rem; line-height:1.6;\n  color:var(--charcoal-soft); margin:0 0 1rem;\n}\n.panel-quote{\n  font-family:var(--serif); font-style:italic; font-size:1.02rem;\n  color:var(--gold-deep); border-left:2px solid var(--gold);\n  padding-left:0.9rem; margin:0.9rem 0 1.1rem;\n}\n\n.wordway-label{\n  font-size:0.98rem;\n  font-weight:800;\n  letter-spacing:0.06em;\n  text-transform:uppercase;\n  color:var(--charcoal);\n  border-bottom:2px solid var(--gold);\n  padding-bottom:0.35rem;\n  margin:1.3rem 0 0.7rem;\n}\n.wordway-label:first-child{ margin-top:0; }\n.wordway-label .wordway-sub{\n  font-weight:600;\n  text-transform:none;\n  letter-spacing:0;\n  color:var(--ink-light);\n  font-size:0.85rem;\n}\n\n.acc-item{\n  background:var(--paper-dim);\n  border:1px solid transparent;\n  border-radius:12px;\n  margin-bottom:0.5rem;\n  overflow:hidden;\n  transition:border-color .2s ease;\n}\n.acc-item[open]{ border-color:var(--gold-wash-strong); }\n.acc-item summary{\n  list-style:none;\n  cursor:pointer;\n  padding:0.8rem 1rem;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:0.6rem;\n  transition:background .2s ease;\n}\n.acc-item summary::-webkit-details-marker{ display:none; }\n.acc-item summary:hover, .acc-item summary:focus-visible{ background:var(--gold-wash); }\n.acc-item[open] > summary{ background:var(--gold-wash); }\n.acc-item .it-title{font-weight:700; color:var(--charcoal); font-size:0.96rem;}\n.acc-item .it-chevron{\n  color:var(--gold-deep); font-size:1rem; flex-shrink:0;\n  transition:transform .2s ease;\n}\n.acc-item[open] .it-chevron{ transform:rotate(180deg); }\n.acc-content{ padding:0 1rem 1rem; }\n\n.group-label{\n  font-size:0.7rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;\n  color:var(--ink-light); margin:0.9rem 0 0.4rem;\n}\n.group-label:first-child{margin-top:0;}\n\n.stage-progress{margin-top:1.2rem;}\n.stage-row{\n  border-top:1px solid var(--line);\n  padding:0.9rem 0;\n}\n.stage-row:first-child{border-top:none;}\n.stage-row .st-name{font-weight:800; color:var(--charcoal); font-size:0.93rem;}\n.stage-row .st-paren{font-weight:500; color:var(--ink-light); font-size:0.78rem; margin-left:0.35rem;}\n.hha{margin-top:0.5rem; display:flex; flex-direction:column; gap:0.35rem;}\n.hha-row{display:flex; gap:0.6rem; font-size:0.9rem; line-height:1.5; font-family:var(--serif); color:var(--charcoal-soft);}\n.hha-tag{\n  flex-shrink:0; width:3.6rem; font-family:var(--sans); font-weight:700;\n  font-size:0.64rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-deep);\n  padding-top:0.15rem;\n}\n\n.detail-block{margin-top:0.9rem;}\n.detail-label{font-size:0.7rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-light); margin-bottom:0.25rem;}\n.detail-value{font-family:var(--serif); font-size:0.98rem; color:var(--charcoal-soft); margin:0 0 0.9rem; line-height:1.55;}\n\n@media (max-width: 720px){\n  .panel{width:100%; top:auto; bottom:0; height:88vh; right:0; border-radius:20px 20px 0 0; transform:translateY(100%);}\n  .panel.open{transform:translateY(0);}\n}\n.panel:not(.open){box-shadow:none;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"stage\">\n\n  \u003cdiv class=\"mission-block\">\n    \u003cp class=\"big-header\">Our Mission\u003c/p>\n    \u003cp class=\"mission\">Summit Church exists to glorify God by making disciples who represent the gospel to every man, woman, and child.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"how-block\">\n    \u003cdiv class=\"how-box\">\u003cp class=\"how-text\">Where and how does disciple-making happen?\u003c/p>\u003c/div>\n    \u003csvg width=\"16\" height=\"26\" viewBox=\"0 0 16 26\" fill=\"none\" aria-hidden=\"true\">\n      \u003cpath d=\"M8 1 L8 20\" stroke=\"#9C8548\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n      \u003cpath d=\"M1 13 L8 22 L15 13\" stroke=\"#9C8548\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    \u003c/svg>\n  \u003c/div>\n\n  \u003cdiv class=\"spaces-box\">\n    \u003cp class=\"big-header\">Disciple-Making Spaces\u003c/p>\n    \u003cp class=\"section-sub\">Five essential spaces \u003cstrong>where\u003c/strong> disciples are made, matured, and mobilized for Christ's mission.\u003c/p>\n\n    \u003cdiv class=\"spaces-row\">\n      \u003cbutton class=\"space-bubble quiet\" data-space=\"divine\">Divine\u003c/button>\n      \u003cdiv class=\"sweet-box-row\">\n        \u003cbutton class=\"space-bubble sweet\" data-space=\"intimate\">Intimate\u003c/button>\n        \u003cbutton class=\"space-bubble sweet\" data-space=\"family\">Family\u003c/button>\n        \u003cbutton class=\"space-bubble sweet\" data-space=\"scattered\">Scattered\u003c/button>\n      \u003c/div>\n      \u003cbutton class=\"space-bubble quiet\" data-space=\"gathered\">Gathered\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"connector-line\">\u003c/div>\n\n    \u003cdiv class=\"sweet-spot-box\">\n      \u003cp class=\"sweet-heading\">Key Relational Spaces\u003c/p>\n      \u003cp class=\"sweet-caption\">\u003cstrong>No individual space is more important than another.\u003c/strong> However, these 3 spaces are \u003cstrong>where\u003c/strong> disciple-making happens in relationships, through our people in the context of everyday life.\u003cbr>The \u003cstrong>AID\u003c/strong> cycle represents \u003cstrong>how\u003c/strong> they will be equipped to do it.\u003c/p>\n\n      \u003cdiv class=\"aid-intro\">\u003cp>\u003cstrong>How\u003c/strong> we \u003cstrong>AID\u003c/strong> the growth of a disciple\u003c/p>\u003c/div>\n\n      \u003cdiv class=\"aid-flow-desktop\" role=\"group\" aria-label=\"The Assess, Identify, Deploy cycle\">\n        \u003cdiv class=\"aid-flow-row\">\n          \u003cbutton class=\"aid-rect\" data-aid=\"assess\">\n            \u003csvg class=\"aid-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/>\u003c/svg>\n            \u003cspan class=\"word\">\u003cspan class=\"num\">1\u003c/span>Assess\u003c/span>\u003cspan class=\"uses\">the Outcomes\u003c/span>\n          \u003c/button>\n          \u003cspan class=\"flow-arrow\" aria-hidden=\"true\">→\u003c/span>\n          \u003cbutton class=\"aid-rect\" data-aid=\"identify\">\n            \u003csvg class=\"aid-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"/>\u003ccircle cx=\"12\" cy=\"10\" r=\"3\"/>\u003c/svg>\n            \u003cspan class=\"word\">\u003cspan class=\"num\">2\u003c/span>Identify\u003c/span>\u003cspan class=\"uses\">the Stage\u003c/span>\n          \u003c/button>\n          \u003cspan class=\"flow-arrow\" aria-hidden=\"true\">→\u003c/span>\n          \u003cbutton class=\"aid-rect\" data-aid=\"deploy\">\n            \u003csvg class=\"aid-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\" ry=\"2\"/>\u003cpath d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>\u003c/svg>\n            \u003cspan class=\"word\">\u003cspan class=\"num\">3\u003c/span>Deploy\u003c/span>\u003cspan class=\"uses\">the Tools\u003c/span>\n          \u003c/button>\n        \u003c/div>\n        \u003csvg class=\"loop-back-svg-h\" viewBox=\"0 0 100 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n          \u003cdefs>\n            \u003cmarker id=\"loopArrowH\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"2.7\" markerHeight=\"2.7\" markerUnits=\"userSpaceOnUse\" orient=\"auto\">\n              \u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#9C8548\"/>\n            \u003c/marker>\n          \u003c/defs>\n          \u003cpath id=\"loopPathH\" d=\"M 85 0 L 85 5 Q 85 8 81 8 L 19 8 Q 15 8 15 5 L 15 1.35\" stroke=\"#9C8548\" stroke-width=\"0.35\" fill=\"none\" marker-end=\"url(#loopArrowH)\"/>\n        \u003c/svg>\n        \u003cp class=\"loop-back-label\">The cycle repeats as people grow\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"aid-flow-mobile\" role=\"group\" aria-label=\"The Assess, Identify, Deploy cycle\">\n        \u003cdiv class=\"aid-flow-col\">\n          \u003cbutton class=\"aid-rect\" data-aid=\"assess\">\n            \u003csvg class=\"aid-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/>\u003c/svg>\n            \u003cspan class=\"word\">\u003cspan class=\"num\">1\u003c/span>Assess\u003c/span>\u003cspan class=\"uses\">the Outcomes\u003c/span>\n          \u003c/button>\n          \u003cspan class=\"flow-arrow-v\" aria-hidden=\"true\">↓\u003c/span>\n          \u003cbutton class=\"aid-rect\" data-aid=\"identify\">\n            \u003csvg class=\"aid-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"/>\u003ccircle cx=\"12\" cy=\"10\" r=\"3\"/>\u003c/svg>\n            \u003cspan class=\"word\">\u003cspan class=\"num\">2\u003c/span>Identify\u003c/span>\u003cspan class=\"uses\">the Stage\u003c/span>\n          \u003c/button>\n          \u003cspan class=\"flow-arrow-v\" aria-hidden=\"true\">↓\u003c/span>\n          \u003cbutton class=\"aid-rect\" data-aid=\"deploy\">\n            \u003csvg class=\"aid-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\" ry=\"2\"/>\u003cpath d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>\u003c/svg>\n            \u003cspan class=\"word\">\u003cspan class=\"num\">3\u003c/span>Deploy\u003c/span>\u003cspan class=\"uses\">the Tools\u003c/span>\n          \u003c/button>\n        \u003c/div>\n        \u003csvg class=\"loop-back-svg-v\" viewBox=\"0 0 22 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n          \u003cdefs>\n            \u003cmarker id=\"loopArrowV\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"userSpaceOnUse\" orient=\"auto\">\n              \u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#9C8548\"/>\n            \u003c/marker>\n          \u003c/defs>\n          \u003cpath id=\"loopPathV\" d=\"M 6 85 L 15 85 Q 19 85 19 81 L 19 19 Q 19 15 15 15 L 6 15\" stroke=\"#9C8548\" stroke-width=\"0.6\" fill=\"none\" marker-end=\"url(#loopArrowV)\"/>\n        \u003c/svg>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cp class=\"hint hint-inside\">Tap a space or a step above to explore\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"loop-connectors\" aria-hidden=\"true\">\n    \u003csvg viewBox=\"0 0 18 46\" fill=\"none\">\n      \u003cpath d=\"M9 2 L9 40\" stroke=\"#9C8548\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n      \u003cpath d=\"M4 33 L9 42 L14 33\" stroke=\"#9C8548\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    \u003c/svg>\n    \u003cspan class=\"loop-label\">The\u003cbr>Result\u003c/span>\n    \u003csvg viewBox=\"0 0 18 46\" fill=\"none\">\n      \u003cpath d=\"M9 44 L9 6\" stroke=\"#9C8548\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n      \u003cpath d=\"M4 13 L9 4 L14 13\" stroke=\"#9C8548\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    \u003c/svg>\n  \u003c/div>\n\n  \u003cdiv class=\"vision-box\">\n    \u003cp class=\"big-header\">Our Vision\u003c/p>\n    \u003cp class=\"section-sub\">The God-given result of a fruitful disciple-making culture.\u003c/p>\n    \u003cdiv class=\"vision-items\">\n      \u003cspan>Multiplying Disciples\u003c/span>\n      \u003cspan>Multiplying Leaders\u003c/span>\n      \u003cspan>Multiplying Churches\u003c/span>\n      \u003cspan>Multiplying Gospel Influence\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003cdiv class=\"scrim\" id=\"scrim\">\u003c/div>\n\u003caside class=\"panel\" id=\"panel\" aria-hidden=\"true\" aria-label=\"Detail panel\">\n  \u003cdiv class=\"panel-header\">\n    \u003cspan class=\"panel-label\" id=\"panel-label\">\u003c/span>\n    \u003cbutton class=\"panel-close\" id=\"panel-close\" aria-label=\"Close panel\">&times;\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"panel-body\" id=\"panel-body\">\u003c/div>\n\u003c/aside>\n\n\u003cscript>\n/* ============ DATA ============ */\nconst SPACES = {\n  divine:   { name:\"Divine\", tag:\"The center of every space\", sweet:false, size:null,\n    def:\"Personal and transformative devotion to God that shapes everything. As we abide in Christ, the Spirit forms us and fuels faithfulness everywhere else.\" },\n  gathered: { name:\"Gathered\", tag:\"Worship, learning, vision, and celebration\", sweet:false, size:\"20+\",\n    def:\"The public space — Sunday gatherings, training, and larger ministry spaces, regardless of the number present.\" },\n  intimate: { name:\"Intimate\", tag:\"Fully known and challenged for Christlikeness\", sweet:true, size:\"2\\u20135\",\n    def:\"A safe space where we are most deeply known, transparent, and lovingly challenged — where sin, suffering, and unbelief come into the light so the gospel can transform us, as we celebrate God and the work He is doing in our lives.\",\n    sweetLabel:\"Deepest Transformation\",\n    sweetNote:\"Where formation becomes deep and personal — believers investing in two or three others, fully known and lovingly challenged. Ordinary members do this work, and discipleship moves from information to transformation.\",\n    withoutIt:\"Sin hides, accountability fades, and formation waits on someone paid to do it.\" },\n  family:   { name:\"Family\", tag:\"Spiritual family experiencing the life of faith\", sweet:true, size:\"8\\u201320\",\n    def:\"Where believers are known, cared for, and equipped to practice the one-anothers — sharing life, carrying burdens, praying, serving, and growing in obedience together.\",\n    sweetLabel:\"Life of Faith\",\n    sweetNote:\"Where faith is lived together as a spiritual family — the one-anothers practiced by the family itself, the Word dwelling among us richly, real needs met by the people who see them. Faith is lived here, not merely learned.\",\n    withoutIt:\"Faith turns individualistic, and care is expected from staff rather than carried by the family.\" },\n  scattered:{ name:\"Scattered\", tag:\"Everyday relationships lived on mission\", sweet:true, size:\"20\\u201370\",\n    def:\"Where members live, work, learn, and play \\u2014 embodying the gospel in the social context of everyday life, with missional intentionality.\",\n    sweetLabel:\"Greatest Access to the Lost\",\n    sweetNote:\"Where our people already are \\u2014 living, working, learning, and playing among those who do not yet know Jesus. No staff member can go where the church already goes; this is mission carried by members into the ordinary stuff of life.\",\n    withoutIt:\"The church turns inward, and mission becomes an event we host rather than a life our people live.\" }\n};\n\nconst STAGES = [\n  { id:\"infant\", name:\"New Disciple\", paren:\"Infant\",\n    def:\"Being established in their faith and the family of God.\",\n    quote:\"\\u201CI do, you watch.\\u201D\",\n    goVerb:\"Establishing\", goTitle:\"Observation and Imitation\",\n    goDesc:\"Establishing a new disciple in their faith through presence, modeling, and guided participation.\" },\n  { id:\"child\", name:\"Growing Disciple\", paren:\"Child\",\n    def:\"Growing up in the essentials of the faith with the help of others.\",\n    quote:\"\\u201CYou do, I watch.\\u201D\",\n    goVerb:\"Growing\", goTitle:\"Participation and Formation\",\n    goDesc:\"Growing a young disciple through practice, guidance, and increasing personal responsibility.\" },\n  { id:\"youngadult\", name:\"Maturing Disciple\", paren:\"Young Adult\",\n    def:\"Taking ownership of their faith and being equipped for multiplication.\",\n    quote:\"\\u201CYou do.\\u201D\",\n    goVerb:\"Equipping\", goTitle:\"Ownership and Transformational Practice\",\n    goDesc:\"Equipping a maturing disciple through challenge, responsibility, and guided leadership of others.\" },\n  { id:\"adult\", name:\"Multiplying Disciple\", paren:\"Parent\",\n    def:\"Fully grown and able to invest in others.\",\n    quote:\"\\u201CYou help others.\\u201D\",\n    goVerb:\"Training\", goTitle:\"Modeling and Multiplication\",\n    goDesc:\"Training leaders to make disciples through a life worth imitating and intentional investment in others.\" }\n];\n\nconst OUTCOMES = [\n  { id:\"intimacy\", name:\"Intimacy With God\",\n    def:\"A growing knowledge and experience of God's heart and activity that comes from pursuing Him as our greatest treasure.\",\n    stages:{ infant:{h:\"Articulates a simple understanding of who God is\", he:\"Expresses a basic desire to know and experience God\", ha:\"Begins engaging Scripture and prayer with others\"},\n      child:{h:\"Articulates basic truths about God and His Word\", he:\"Demonstrates a growing desire to know and enjoy God\", ha:\"Beginning to engage God\\u2019s word and prayer on their own\"},\n      youngadult:{h:\"Holds theological clarity of who God is and what He does\", he:\"Expresses a deepening satisfaction in God as their highest treasure\", ha:\"Engages God regularly through transformative spiritual practices\"},\n      adult:{h:\"Helps others understand who God is and what He does\", he:\"Models a life of abiding in God that others can follow\", ha:\"Equips others to engage scripture, prayer, and confession\"} } },\n  { id:\"fruit\", name:\"Fruit of the Spirit\",\n    def:\"An increasing experience of the Holy Spirit's presence that demonstrates the character of God and distinguishes His people from an unbelieving world.\",\n    stages:{ infant:{h:\"Articulates a basic awareness of the spiritual battle\", he:\"Expresses their desire for the Holy Spirit\\u2019s help to change\", ha:\"Begins to identify sin and need for grace with help\"},\n      child:{h:\"Shows growing awareness of the spiritual battle\", he:\"Demonstrates a growing dependence on the Spirit\", ha:\"Identifies sin and pursues obedience with help from others\"},\n      youngadult:{h:\"Engages the spiritual battle with confidence in the Spirit\", he:\"Desires to grow in Christlikeness and obedience\", ha:\"Takes responsibility to fight sin and pursue transformation\"},\n      adult:{h:\"Instructs others in engaging in the spiritual battle\", he:\"Compels others to identify sin and pursue Christlikeness\", ha:\"Models ongoing repentance and dependence on the Spirit\"} } },\n  { id:\"grace\", name:\"Grace Story\",\n    def:\"An increasing awareness of the gospel that transforms our lives and compels us to share God's grace with others.\",\n    stages:{ infant:{h:\"Understands the basic message of the gospel\", he:\"Basic awareness of their new identity in Christ\", ha:\"Explains the gospel in simple terms\"},\n      child:{h:\"Understands their place in God\\u2019s bigger story\", he:\"Expresses a growing burden for others to know Jesus\", ha:\"Communicates the gospel with increasing clarity\"},\n      youngadult:{h:\"Grasps how the gospel story shapes their identity\", he:\"Demonstrates confidence in Christ and their identity\", ha:\"Models gospel fluency in life and relationships\"},\n      adult:{h:\"Helps others interpret their story in light of the gospel\", he:\"Helps others embrace their identity in Christ\", ha:\"Models gospel fluency and equips others in it\"} } },\n  { id:\"mission\", name:\"Personal Mission\",\n    def:\"A growing understanding of God's mission and how He has uniquely gifted each of us to love and serve His church and the places where we live, work, and play.\",\n    stages:{ infant:{h:\"Basic awareness of their place in God\\u2019s family\", he:\"Receives and responds to care in community\", ha:\"Is baptized into and served by the family of God\"},\n      child:{h:\"Recognizes everyday life as the context for mission\", he:\"Desires to live as a committed member of church family\", ha:\"Discovers and begins using their gifts to serve others\"},\n      youngadult:{h:\"Understands their unique role in God\\u2019s purposes\", he:\"Desires to invest in the lives of others with purpose\", ha:\"Intentionally serves others in the church and everyday life\"},\n      adult:{h:\"Helps others know their place in God\\u2019s redemptive mission\", he:\"Encourages deeper commitment to the family of God\", ha:\"Equips others to use their gifts to serve the church and world\"} } },\n  { id:\"stewardship\", name:\"Stewardship of Life\",\n    def:\"An increasing willingness to use everything God has entrusted to us to reflect His glory.\",\n    stages:{ infant:{h:\"Basic awareness of God as their provider\", he:\"Observes cheerful stewardship in others\", ha:\"Takes simple steps to steward their life\"},\n      child:{h:\"Understands God\\u2019s call to steward all of life\", he:\"Experiences God as their provider and begins to rely on Him\", ha:\"Begins prioritizing life around God\\u2019s purposes\"},\n      youngadult:{h:\"Convinced all they have is entrusted by God\", he:\"Joyfully lives with open hands regarding time and resources\", ha:\"Practices consistent generosity and service\"},\n      adult:{h:\"Teaches others to trust God and steward their lives\", he:\"Inspires others toward generosity and sacrificial living\", ha:\"Models a life of open-handed stewardship\"} } }\n];\n\nconst CATEGORIES = [\n  { id:\"gospelstory\", group:\"Word\", name:\"Gospel Story\",\n    def:\"Forming a disciple who understands, believes, and lives from the gospel as the foundation of their identity and participation in God\\u2019s redemptive mission.\" },\n  { id:\"knowinggod\", group:\"Word\", name:\"Knowing God\",\n    def:\"Developing a disciple with a growing understanding of God and His word that shapes how they think, discern, and engage the world.\" },\n  { id:\"communion\", group:\"Way\", name:\"Communion with God\",\n    def:\"Cultivating a disciple who abides with God through personal relationship and spiritual practices that transform their heart and life.\" },\n  { id:\"community\", group:\"Way\", name:\"Life in Community\",\n    def:\"Equipping a disciple to live out their faith in biblical community through relationships, service, and shared mission.\" },\n  { id:\"onmission\", group:\"Way\", name:\"Life on Mission\",\n    def:\"Mobilizing a disciple to confidently and meaningfully engage in God\\u2019s mission by representing the gospel where they live, work, and play.\" }\n];\n\nconst AID = {\n  assess:  { title:\"Assess\", eyebrow:\"Step One\", sub:\"Outcomes \\u2014 qualitative growth\",\n    intro:\"We utilize our language around the discipleship outcomes to look for what is actually true in a person\\u2019s life \\u2014 not attendance or activity, but real qualitative growth. The five Discipleship Outcomes give us shared language for it.\" },\n  identify:{ title:\"Identify\", eyebrow:\"Step Two\", sub:\"Stage \\u2014 current growth stage\",\n    intro:\"Growth is not one fixed label. A person may be maturing in one area and just beginning in another, so we identify a stage per outcome \\u2014 never an overall level of maturity. Each stage helps us understand specifically what type of investment that person needs most.\" },\n  deploy:  { title:\"Deploy\", eyebrow:\"Step Three\", sub:\"Categories (Tools) \\u2014 targeted next steps\",\n    intro:\"Based on where they need to grow, our people identify the relationships and tools needed for the job. Categories aren\\u2019t one-to-one with Outcomes \\u2014 one category can shape several outcomes at once, and one outcome can grow through several categories.\" }\n};\n\n/* ============ PANEL ENGINE ============ */\nconst scrim = document.getElementById('scrim');\nconst panel = document.getElementById('panel');\nconst panelBody = document.getElementById('panel-body');\nconst panelLabel = document.getElementById('panel-label');\nlet lastFocused = null;\n\nfunction setPanelContent(label, html){\n  panelLabel.textContent = label;\n  panelBody.innerHTML = html;\n  panelBody.scrollTop = 0;\n}\n\nfunction openPanel(){\n  lastFocused = document.activeElement;\n  scrim.classList.add('open');\n  panel.classList.add('open');\n  panel.setAttribute('aria-hidden','false');\n  document.body.style.overflow = 'hidden';\n  document.getElementById('panel-close').focus();\n}\nfunction closePanel(){\n  scrim.classList.remove('open');\n  panel.classList.remove('open');\n  panel.setAttribute('aria-hidden','true');\n  document.body.style.overflow = '';\n  if(lastFocused) lastFocused.focus();\n}\n\n/* ---- Outcome / Stage detail markup (used inside inline accordions) ---- */\nfunction outcomeDetailHtml(o){\n  const rows = STAGES.map(s => {\n    const d = o.stages[s.id];\n    return `\n      \u003cdiv class=\"stage-row\">\n        \u003cspan class=\"st-name\">${s.name}\u003c/span>\u003cspan class=\"st-paren\">${s.paren}\u003c/span>\n        \u003cdiv class=\"hha\">\n          \u003cdiv class=\"hha-row\">\u003cspan class=\"hha-tag\">Head\u003c/span>\u003cspan>${d.h}\u003c/span>\u003c/div>\n          \u003cdiv class=\"hha-row\">\u003cspan class=\"hha-tag\">Heart\u003c/span>\u003cspan>${d.he}\u003c/span>\u003c/div>\n          \u003cdiv class=\"hha-row\">\u003cspan class=\"hha-tag\">Hand\u003c/span>\u003cspan>${d.ha}\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>`;\n  }).join('');\n  return `\n    \u003cp class=\"detail-value\" style=\"margin-top:0.2rem;\">${o.def}\u003c/p>\n    \u003cp class=\"group-label\">How this looks at each stage\u003c/p>\n    \u003cdiv class=\"stage-progress\">${rows}\u003c/div>\n  `;\n}\n\nfunction stageDetailHtml(s){\n  return `\n    \u003cp class=\"panel-quote\" style=\"margin-top:0.2rem;\">${s.quote}\u003c/p>\n    \u003cdiv class=\"detail-block\">\n      \u003cdiv class=\"detail-label\">Goal\u003c/div>\n      \u003cp class=\"detail-value\">${s.def}\u003c/p>\n      \u003cdiv class=\"detail-label\">Objective \\u2014 ${s.goVerb}\u003c/div>\n      \u003cp class=\"detail-value\">\u003cem>${s.goTitle}.\u003c/em> ${s.goDesc}\u003c/p>\n    \u003c/div>\n  `;\n}\n\n/* ---- Views ---- */\nfunction spaceView(id){\n  const s = SPACES[id];\n  const sizeLine = s.size ? ` \\u00B7 Typically ${s.size} people` : '';\n  let html = `\n    \u003cp class=\"panel-eyebrow\">${s.sweet ? 'Sweet Spot Space' : 'Relational Space'}\u003c/p>\n    \u003ch2 class=\"panel-title\">${s.name}\u003c/h2>\n    \u003cp class=\"panel-sub\">${s.tag}${sizeLine}\u003c/p>\n    \u003cp class=\"panel-text\">${s.def}\u003c/p>\n  `;\n  if(s.sweet){\n    html += `\n      \u003cp class=\"group-label\">Why It Is a Key Relational Space \\u2014 ${s.sweetLabel}\u003c/p>\n      \u003cp class=\"panel-text\">${s.sweetNote}\u003c/p>\n      \u003cp class=\"panel-quote\">Without it: ${s.withoutIt}\u003c/p>\n    `;\n  }\n  return { label: s.name, html };\n}\n\nfunction aidListView(key){\n  const a = AID[key];\n  let itemsHtml = '';\n  if(key === 'assess'){\n    itemsHtml = OUTCOMES.map(o => `\n      \u003cdetails class=\"acc-item\">\n        \u003csummary>\u003cspan class=\"it-title\">${o.name}\u003c/span>\u003cspan class=\"it-chevron\">\\u2304\u003c/span>\u003c/summary>\n        \u003cdiv class=\"acc-content\">${outcomeDetailHtml(o)}\u003c/div>\n      \u003c/details>`).join('');\n  } else if(key === 'identify'){\n    itemsHtml = STAGES.map(s => `\n      \u003cdetails class=\"acc-item\">\n        \u003csummary>\u003cspan class=\"it-title\">${s.name} \u003cspan style=\"text-transform:none; color:var(--ink-light); font-weight:500;\">(${s.paren})\u003c/span>\u003c/span>\u003cspan class=\"it-chevron\">\\u2304\u003c/span>\u003c/summary>\n        \u003cdiv class=\"acc-content\">${stageDetailHtml(s)}\u003c/div>\n      \u003c/details>`).join('');\n  } else if(key === 'deploy'){\n    const word = CATEGORIES.filter(c=>c.group==='Word');\n    const way = CATEGORIES.filter(c=>c.group==='Way');\n    const rowsFor = (arr) => arr.map(c => `\n      \u003cdiv class=\"detail-block\">\n        \u003cdiv class=\"detail-label\">${c.name}\u003c/div>\n        \u003cp class=\"detail-value\">${c.def}\u003c/p>\n      \u003c/div>`).join('');\n    itemsHtml = `\n      \u003cp class=\"wordway-label\">Word \u003cspan class=\"wordway-sub\">\\u2014 Beliefs\u003c/span>\u003c/p>\n      ${rowsFor(word)}\n      \u003cp class=\"wordway-label\">Way \u003cspan class=\"wordway-sub\">\\u2014 Practices\u003c/span>\u003c/p>\n      ${rowsFor(way)}\n    `;\n  }\n  return {\n    label: a.title,\n    html: `\n      \u003cp class=\"panel-eyebrow\">${a.eyebrow}\u003c/p>\n      \u003ch2 class=\"panel-title\">${a.title}\u003c/h2>\n      \u003cp class=\"panel-sub\">${a.sub}\u003c/p>\n      \u003cp class=\"panel-text\">${a.intro}\u003c/p>\n      ${itemsHtml}\n    `\n  };\n}\n\n/* ---- Entry points ---- */\nfunction openSpace(id){\n  const v = spaceView(id);\n  setPanelContent(v.label, v.html);\n  openPanel();\n}\nfunction openAid(key){\n  const v = aidListView(key);\n  setPanelContent(v.label, v.html);\n  openPanel();\n}\n\n/* ---- Wire up buttons ---- */\ndocument.querySelectorAll('[data-space]').forEach(el=>{\n  el.addEventListener('click', () => openSpace(el.getAttribute('data-space')));\n});\ndocument.querySelectorAll('[data-aid]').forEach(el=>{\n  el.addEventListener('click', () => openAid(el.getAttribute('data-aid')));\n});\ndocument.getElementById('panel-close').addEventListener('click', closePanel);\nscrim.addEventListener('click', closePanel);\ndocument.addEventListener('keydown', (e)=>{\n  if(e.key === 'Escape' && panel.classList.contains('open')) closePanel();\n});\n\n/* ---- Keep the loop-back arrows precisely centered on box 1 and box 3 ---- */\nfunction alignLoopArrowH(){\n  const row = document.querySelector('.aid-flow-row');\n  const path = document.getElementById('loopPathH');\n  if(!row || !path || row.offsetParent === null) return;\n  const rects = row.querySelectorAll('.aid-rect');\n  if(rects.length \u003c 3) return;\n  const rowBox = row.getBoundingClientRect();\n  if(rowBox.width === 0) return;\n  const r1 = rects[0].getBoundingClientRect();\n  const r3 = rects[2].getBoundingClientRect();\n  const c1 = ((r1.left + r1.right) / 2 - rowBox.left) / rowBox.width * 100;\n  const c3 = ((r3.left + r3.right) / 2 - rowBox.left) / rowBox.width * 100;\n  path.setAttribute('d', `M ${c3} 0 L ${c3} 5 Q ${c3} 8 ${c3-4} 8 L ${c1+4} 8 Q ${c1} 8 ${c1} 5 L ${c1} 1.35`);\n}\nfunction alignLoopArrowV(){\n  const col = document.querySelector('.aid-flow-col');\n  const svg = document.querySelector('.loop-back-svg-v');\n  const path = document.getElementById('loopPathV');\n  if(!col || !svg || !path || col.offsetParent === null) return;\n  const rects = col.querySelectorAll('.aid-rect');\n  if(rects.length \u003c 3) return;\n  const colBox = col.getBoundingClientRect();\n  const svgBox = svg.getBoundingClientRect();\n  if(colBox.height === 0 || svgBox.width === 0) return;\n  const W = svgBox.width;\n  const H = colBox.height;\n  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);\n  const r1 = rects[0].getBoundingClientRect();\n  const r3 = rects[2].getBoundingClientRect();\n  const y1 = (r1.top + r1.bottom) / 2 - colBox.top;\n  const y3 = (r3.top + r3.bottom) / 2 - colBox.top;\n  const outX = W - 4;\n  path.setAttribute('d', `M 6 ${y3} L ${outX-4} ${y3} Q ${outX} ${y3} ${outX} ${y3-4} L ${outX} ${y1+4} Q ${outX} ${y1} ${outX-4} ${y1} L 6 ${y1}`);\n}\nfunction alignLoopArrows(){ alignLoopArrowH(); alignLoopArrowV(); }\nwindow.addEventListener('load', alignLoopArrows);\nwindow.addEventListener('resize', alignLoopArrows);\nif (document.fonts && document.fonts.ready) {\n  document.fonts.ready.then(alignLoopArrows);\n}\nalignLoopArrows();\nsetTimeout(alignLoopArrows, 300);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script>
"use strict";

function remoteApi(){
  async function rpc(fn,args){
    const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify(args)});
    const j=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((j&&j.message)||"Request failed");
    return j;
  }
  return {
    teamGet:t=>rpc("team_get",{p_token:t}),
    claimSet:(t,id,on)=>rpc("claim_set",{p_token:t,p_indicator:id,p_on:on}),
    claimNote:(t,id,note)=>rpc("claim_note",{p_token:t,p_indicator:id,p_note:note}),
    stepSave:(t,step)=>rpc("step_save",{p_token:t,p_step:step}),
    stepDelete:(t,id)=>rpc("step_delete",{p_token:t,p_id:id}),
    flagSet:(t,key,done)=>rpc("flag_set",{p_token:t,p_key:key,p_done:done}),
    adminGet:k=>rpc("admin_get",{p_key:k}),
    adminSetToken:(k,team,nw)=>rpc("admin_set_token",{p_key:k,p_team:team,p_new:nw})
  };
}

function coverGrid(d,steps,cat){

const SPACE_KEYS=["Divine","Intimate","Family","Scattered","Gathered"];
const spaceCounts=(steps,field)=>{const c={};SPACE_KEYS.forEach(k=>c[k]=0);steps.forEach(x=>{const v=x[field];if(v&&c[v]!==undefined)c[v]++;});return c;};
function spaceBar(counts,total,emptyMsg,label,mini){
  const segs=SPACE_KEYS.filter(k=>counts[k]).map(k=>'<span class="spseg sp-'+k.toLowerCase()+'" style="flex:'+counts[k]+'" title="'+k+": "+counts[k]+'">'+counts[k]+"</span>").join("");

  return '<div class="sprow'+(label?"":" nolab")+'">'+(label?'<span class="splab">'+label+"</span>":"")+(total?'<div class="spbar'+(mini?" mini":"")+'" role="img" aria-label="'+esc((label||"Ideal spaces")+": "+desc)+'">'+segs+"</div>":'<div class="spbar spempty">'+emptyMsg+"</div>")+"</div>";
}
function spaceViz(steps,cat,stageIdx){
  const ideal=spaceCounts(steps,"ideal_space"),sec=spaceCounts(steps,"secondary_space");
  const ni=steps.length,ns=steps.filter(x=>x.secondary_space).length;
  const rel=ideal.Intimate+ideal.Family+ideal.Scattered,pct=ni?Math.round(rel/ni*100):0;
  let h='<section class="spaces" aria-label="Spaces used"><header><h3>Spaces used</h3>'+(ni?'<span class="sub">'+pct+"% of ideal spaces are key relational</span>":"")+'</header><div class="spbody">';
  h+=spaceBar(ideal,ni,"No steps yet","Ideal")+spaceBar(sec,ns,"No secondary spaces named","Secondary");
  h+='<ul class="splegend">'+SPACES.map(([k,sz])=>'<li><i class="spsw sp-'+k.toLowerCase()+'"></i><b>'+k+'</b> <span class="sub">('+sz+")</span> · ideal "+ideal[k]+" · secondary "+sec[k]+"</li>").join("")+"</ul>";
  h+='<p class="sub" style="margin:.5rem 0 0">Gold tones are the key relational spaces: Intimate, Family, and Scattered. Greys are Divine and Gathered.</p>';
  const need=stageIdx===0?70:50;
  if(cat&&ni>=2&&pct<need){
    h+='<p class="note warn" style="margin:.8rem 0 0"><b>Look again at the spaces.</b> '+(stageIdx===0?"New disciples need to be highly relational, but only "+pct+"% of the ideal spaces here are Intimate, Family, or Scattered.":"Only "+pct+"% of the ideal spaces here are Intimate, Family, or Scattered.")+" Could more of these steps be carried by a person or a small group instead of a gathering?</p>";
  }
  return h+"</div></section>";
}
function checkPanel(d,steps,cat,st,U){
  const claimed=cat?INDS.filter(i=>i.s===st&&d.claims[i.id]):[];
  const miss=claimed.filter(i=>!steps.some(x=>(x.indicators||[]).includes(i.id)));
  const missP=PRINCIPLES.filter(p=>!steps.some(x=>(x.principles||[]).includes(p[0])));
  const rel=steps.filter(x=>["Intimate","Family","Scattered"].includes(x.ideal_space)).length;
  const pct=steps.length?Math.round(rel/steps.length*100):0;
  const need=cat&&st===0?70:50;
  const spaceOk=!cat||steps.length<2||pct>=need;
  const wt=steps.filter(x=>x.tool&&x.tool.trim()).length;
  const items=[];
  if(cat)items.push([claimed.length>0&&!miss.length,claimed.length?(miss.length?miss.length+" of "+claimed.length+" claimed outcomes aren’t addressed by a step yet.":"Every claimed outcome is addressed by at least one step."):"No outcomes claimed at this stage yet."]);
  items.push([!missP.length,missP.length?"Not yet represented: "+missP.map(p=>p[0]).join(", ")+".":"All seven principles show up in this stage."]);
  items.push([steps.length>0&&spaceOk,steps.length?pct+"% of ideal spaces are Intimate, Family, or Scattered."+(spaceOk?"":(cat&&st===0?" New disciples need to be highly relational.":" Look for steps a person or small group could carry.")):"No steps yet."]);
  items.push([steps.length>0&&wt===steps.length,wt+" of "+steps.length+" steps describe a tool. Tools can be named afterward."]);
  const checked=!!S.checked[st];
  return '<section class="checkpanel"><h3>Check your work</h3><p>Here’s where things stand:</p><ul class="cwlist">'+
    items.map(([ok,t])=>'<li class="'+(ok?"ok":"no")+'"><span aria-hidden="true">'+(ok?"✓":"○")+"</span><span>"+esc(t)+"</span></li>").join("")+"</ul>"+
    '<label class="cb"><input type="checkbox" data-a="toggleCheck" data-v="'+st+'" data-key="chk'+st+'"'+(checked?" checked":"")+"><span>I’ve checked my work using the checklists.</span></label>"+
    '<div class="row" style="margin:.6rem 0 0"><button class="btn" data-a="setFlag" data-v="unit'+st+'"'+(checked?"":" disabled")+">Mark complete</button>"+(checked?"":'<span class="sub">Check the box above to unlock this.</span>')+"</div></section>";
}
function donePanel(d,steps,cat,st,U){
  const claimed=cat?INDS.filter(i=>i.s===st&&d.claims[i.id]):[];
  const miss=claimed.filter(i=>!steps.some(x=>(x.indicators||[]).includes(i.id)));

}
function bView(d,ro){
  const st=S.stage,cat=d.team.kind==="category",U=unitsOf(d.team.kind);
